<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지휘 책상</title>
<style>
  @font-face {
    font-family: "Pretendard";
    src: url("/fonts/PretendardVariable.woff2") format("woff2");
    font-weight: 45 920;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --surface-content: #202432;
    --surface-panel: #232837;
    --surface-raised: #2A303F;
    --text-strong: #FFFFFF;
    --text-body: #B9BFCF;
    --text-muted: #959DB6;
    --accent: #7C87F7;
    --attention: #FBBF24;
    --success: #34D399;
    --danger: #F87171;
    --neutral: #94A3B8;
    --brand-fill: #5B63D3;
    --on-brand: #FFFFFF;
    --attention-tint: color-mix(in srgb, var(--attention) 10%, transparent);
    --success-tint: color-mix(in srgb, var(--success) 10%, transparent);
    --danger-tint: color-mix(in srgb, var(--danger) 10%, transparent);
    --neutral-tint: color-mix(in srgb, var(--neutral) 10%, transparent);
    --hover-face: color-mix(in srgb, var(--surface-raised) 50%, transparent);
    --font-sans: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --radius-control: 6px;
    --radius-card: 8px;
    --menu-w: 264px;
    --menu-w-collapsed: 64px;
    --motion: 150ms;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    display: flex;
    min-height: 100vh;
    background: var(--surface-content);
    color: var(--text-body);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    word-break: keep-all;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---- 앱 셸: 좌측 메뉴 ---- */
  #menu {
    width: var(--menu-w);
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--surface-panel);
    border-right: 1px solid var(--surface-raised);
    z-index: 5;
  }
  #menu.collapsed { width: var(--menu-w-collapsed); align-items: center; }
  .menu-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    width: 100%;
  }
  #menu.collapsed .menu-head { justify-content: center; padding: 0; }
  .menu-title { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  #menu.collapsed .menu-title { display: none; }
  .menu-toggle {
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--surface-raised);
    border-radius: var(--radius-control);
    background: var(--surface-panel);
    color: var(--text-muted);
    cursor: pointer;
  }
  .menu-toggle:hover { border-color: var(--text-muted); }
  .menu-toggle svg { transition: transform var(--motion); }
  #menu.collapsed .menu-toggle svg { transform: rotate(180deg); }
  .menu-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
  }
  .menu-item {
    position: relative;
    appearance: none;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    height: 36px;
    padding: 0 8px;
    border: none;
    border-radius: var(--radius-control);
    background: transparent;
    color: var(--text-body);
    font: inherit;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
    transition: background-color var(--motion), color var(--motion);
  }
  .menu-item .icon { flex-shrink: 0; color: var(--text-muted); }
  .menu-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-item:hover { background: var(--hover-face); color: var(--text-strong); }
  .menu-item:hover .icon { color: var(--text-strong); }
  .menu-item[aria-current="page"] {
    background: var(--surface-raised);
    color: var(--text-strong);
    font-weight: 500;
  }
  .menu-item[aria-current="page"] .icon,
  .menu-item.parent-active .icon { color: var(--text-strong); }
  .menu-item.parent-active { color: var(--text-strong); }
  .menu-item .chev { flex-shrink: 0; color: var(--text-muted); transition: transform var(--motion); }
  .menu-item[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .badge-count {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 500;
    color: var(--attention);
  }
  .badge-count:empty { display: none; }
  .menu-item { position: relative; }
  #menu.collapsed .menu-item[data-has-badge="1"]::after {
    content: "";
    position: absolute;
    top: 4px;
    right: 4px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--attention);
  }
  .sub-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-left: 16px;
    padding-left: 8px;
    border-left: 1px solid var(--surface-raised);
  }
  .sub-list[hidden] { display: none; }
  .menu-item.sub { height: 32px; font-size: 13px; }
  #menu.collapsed .menu-item { width: 36px; justify-content: center; padding: 0; }
  #menu.collapsed .menu-item .label,
  #menu.collapsed .menu-item .chev,
  #menu.collapsed .badge-count,
  #menu.collapsed .sub-list { display: none; }
  .tip {
    display: none;
    position: absolute;
    left: 48px;
    top: 4px;
    padding: 4px 8px;
    border: 1px solid var(--surface-raised);
    border-radius: var(--radius-control);
    background: var(--surface-raised);
    color: var(--text-strong);
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    pointer-events: none;
  }
  #menu.collapsed .menu-item:hover .tip,
  #menu.collapsed .menu-item:focus-visible .tip { display: block; }

  main {
    flex: 1;
    min-width: 0;
    max-width: 1040px;
    padding: 32px 40px;
  }
  .tab-panel[hidden] { display: none; }
  .empty-msg {
    color: var(--text-muted);
    padding: 24px 8px;
    text-align: center;
  }
  .card {
    background: var(--surface-content);
    border: 1px solid var(--surface-raised);
    border-radius: var(--radius-card);
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .card.locked { background: var(--surface-panel); }
  .card-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 4px;
  }
  .card-meta .repo-chip {
    background: var(--surface-panel);
    border: 1px solid var(--surface-raised);
    color: var(--text-strong);
    border-radius: var(--radius-control);
    padding: 1px 8px;
    font-weight: 500;
    font-family: var(--font-mono);
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: var(--radius-control);
    font-weight: 600;
  }
  .badge.premise { background: var(--attention-tint); color: var(--attention); }
  .badge.applied { background: var(--success-tint); color: var(--success); }
  .card h3 {
    margin: 4px 0 2px;
    font-size: 16px;
    color: var(--text-strong);
  }
  .card .why {
    color: var(--text-muted);
    margin: 0 0 10px;
  }
  .card .see {
    color: var(--text-muted);
    font-size: 12px;
    margin: 0 0 10px;
  }

  #banner {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-panel);
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: var(--radius-card);
    padding: 10px 16px;
    font-size: 13px;
    max-width: 90vw;
  }
  #banner[hidden] { display: none; }

  /* ---- 공통 컴포넌트 (DESIGN.md §5) ---- */
  .status-dot-label {
    display: inline-flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text-strong);
  }
  .status-dot-label .dot {
    width: 8px;
    height: 8px;
    margin-top: 5px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--neutral);
  }
  .status-dot-label.accent .dot { background: var(--accent); }
  .status-dot-label.attention { color: var(--attention); }
  .status-dot-label.attention .dot { background: var(--attention); }
  .status-dot-label.success { color: var(--success); }
  .status-dot-label.success .dot { background: var(--success); }
  .status-dot-label.danger { color: var(--danger); }
  .status-dot-label.danger .dot { background: var(--danger); }
  .status-dot-label.neutral { color: var(--neutral); }
  .status-dot-label.neutral .dot { background: var(--neutral); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--surface-raised);
    border-radius: var(--radius-control);
    background: var(--surface-panel);
    font: inherit;
    font-size: 13px;
    color: var(--text-body);
    cursor: pointer;
  }
  .chip .chip-label { color: var(--text-muted); }
  .chip .chip-sep { width: 1px; height: 14px; background: var(--surface-raised); }
  .chip .chip-value { color: var(--text-strong); }
  .chip:hover { border-color: var(--text-muted); }

  .data-table {
    border: 1px solid var(--surface-raised);
    border-radius: var(--radius-card);
    overflow: hidden;
  }
  .data-table .dt-head,
  .data-table .dt-row {
    display: grid;
    grid-template-columns: var(--dt-cols, repeat(4, minmax(0, 1fr)));
    gap: 16px;
    padding: 8px 16px;
  }
  .data-table .dt-head {
    background: var(--surface-panel);
    border-bottom: 1px solid var(--surface-raised);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
  }
  .data-table .dt-head > * {
    position: relative;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .data-table .dt-row {
    padding: 12px 16px;
    border-bottom: 1px solid var(--surface-raised);
    font-size: 13px;
    line-height: 1.4;
    color: var(--text-body);
  }
  .data-table .dt-row:last-child { border-bottom: none; }
  .data-table .dt-row:hover { background: var(--hover-face); }
  .data-table .dt-row .mono { font-family: var(--font-mono); font-size: 12px; }
  .data-table .dt-row .muted { color: var(--text-muted); }
  .data-table .dt-row .cell { min-width: 0; overflow-wrap: anywhere; }
  .data-table .dt-head [data-tooltip]:hover::after,
  .data-table .dt-head [data-tooltip]:focus-visible::after {
    content: attr(data-tooltip);
    position: absolute;
    left: 0;
    top: 100%;
    margin-top: 4px;
    padding: 4px 8px;
    border-radius: var(--radius-control);
    background: var(--surface-raised);
    color: var(--text-strong);
    font-size: 12px;
    white-space: nowrap;
    z-index: 10;
  }
  .tooltip {
    padding: 4px 8px;
    border-radius: var(--radius-control);
    background: var(--surface-raised);
    color: var(--text-strong);
    font-size: 12px;
    white-space: nowrap;
  }

  .kpi-tile {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 16px;
    border: 1px solid var(--surface-raised);
    border-radius: var(--radius-card);
  }
  .kpi-tile .kpi-label { font-size: 12px; font-weight: 500; color: var(--text-muted); }
  .kpi-tile .kpi-value { font-size: 20px; font-weight: 600; color: var(--text-strong); }
  .kpi-tile .kpi-delta { font-size: 12px; font-weight: 500; color: var(--text-muted); }
  .kpi-tile .kpi-delta.danger { color: var(--danger); }
  .kpi-tile .kpi-delta.success { color: var(--success); }

  .decision-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    border: 1px solid var(--surface-raised);
    border-radius: var(--radius-card);
  }
  .decision-card .dc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .decision-card .dc-title { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .decision-card .dc-meta { font-family: var(--font-mono); font-size: 12px; color: var(--text-body); }
  .decision-card .dc-opt {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid transparent;
    border-radius: var(--radius-control);
    font-size: 13px;
    color: var(--text-body);
  }
  .decision-card .dc-opt.rec { color: var(--text-muted); }
  .decision-card .dc-opt.picked {
    background: var(--surface-raised);
    border-color: var(--accent);
    color: var(--text-strong);
  }
  .decision-card .dc-lock { font-size: 13px; color: var(--text-muted); }
  .decision-card .dc-error { font-size: 13px; color: var(--danger); }

  .empty-state-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 24px 16px;
    border: 1px solid var(--surface-raised);
    border-radius: var(--radius-card);
    text-align: center;
  }
  .empty-state-card .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neutral); }
  .empty-state-card .esc-title { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .empty-state-card .esc-next { font-size: 13px; line-height: 1.5; color: var(--text-muted); }

  .inline-note {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 12px;
    border-radius: var(--radius-control);
    font-size: 13px;
    line-height: 1.4;
    background: var(--neutral-tint);
    color: var(--neutral);
  }
  .inline-note .dot { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; flex-shrink: 0; background: currentColor; }
  .inline-note.attention { background: var(--attention-tint); color: var(--attention); }
  .inline-note.danger { background: var(--danger-tint); color: var(--danger); }

  .wait-line { padding: 16px 0; text-align: center; font-size: 13px; color: var(--text-body); }

  .btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    padding: 0 16px;
    border: 1px solid transparent;
    border-radius: var(--radius-control);
    background: var(--surface-raised);
    color: var(--text-strong);
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--text-muted); }
  .btn:disabled { color: var(--text-muted); cursor: default; }
  .btn.accent { background: var(--brand-fill); color: var(--on-brand); }
  .btn.accent:hover:not(:disabled) { border-color: var(--accent); }
  .btn.sm { height: 28px; padding: 0 12px; font-size: 13px; }
  .btn.confirm-pending { border-color: var(--attention); }

  .screen { display: flex; flex-direction: column; gap: 20px; }
  .page-head { display: flex; flex-direction: column; gap: 8px; }
  .page-head h1 { margin: 0; font-size: 20px; font-weight: 600; color: var(--text-strong); }
  .page-head p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-muted); }
  .chip-row { display: flex; gap: 8px; }
  .section-title { margin: 8px 0 -8px; font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .muted-line { margin: 0; font-size: 13px; color: var(--text-muted); }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }

  /* ---- 풀스택 신호 띠(가설 게이트, 읽기 전용) ---- */
  .hyp-band { display: flex; flex-direction: column; gap: 12px; }
  .hyp-reason {
    display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 14px;
    border: 1px solid var(--surface-raised); border-radius: var(--radius-card);
    background: var(--surface-panel); font-size: 13px; color: var(--text-body);
  }
  .hyp-reason .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--neutral); }
  .hyp-reason.attention .dot { background: var(--attention); }
  .hyp-reason.danger .dot { background: var(--danger); }
  .hyp-summary {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 12px 16px;
    border: 1px solid var(--surface-raised); border-radius: var(--radius-card); background: var(--surface-content);
  }
  .hyp-summary .hyp-scope {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    padding-right: 16px; border-right: 1px solid var(--surface-raised);
  }
  .hyp-summary .hyp-sep { width: 1px; height: 20px; background: var(--surface-raised); }
  .hyp-stat { display: flex; align-items: baseline; gap: 8px; }
  .hyp-stat .hs-label { font-size: 12px; color: var(--text-muted); }
  .hyp-stat .hs-value { font-size: 18px; font-weight: 600; color: var(--text-strong); }
  .hyp-stat .hs-sub { font-size: 12px; color: var(--text-muted); }
  .hyp-stat .hs-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-body); }
  .hyp-stat .hs-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--attention); }
  .hyp-summary .hyp-ref { margin-left: auto; font-size: 12px; color: var(--text-muted); }
  .hyp-cards { display: flex; gap: 12px; }
  .hyp-card {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px;
    border: 1px solid var(--surface-raised); border-radius: var(--radius-card); background: var(--surface-content);
  }
  .hyp-card .hc-head { display: flex; justify-content: space-between; align-items: baseline; }
  .hyp-card .hc-name { font-size: 13px; font-weight: 600; color: var(--text-strong); }
  .hyp-card .hc-count { font-size: 12px; color: var(--text-muted); }
  .hyp-card b { font-weight: 600; color: var(--text-strong); }
  .hyp-card .hc-count b { font-size: 16px; }
  .hyp-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--surface-raised); }
  .hyp-bar .seg-right { background: var(--success); }
  .hyp-bar .seg-partial { background: var(--attention); }
  .hyp-bar .seg-wrong { background: var(--danger); }
  .hyp-bar .seg-pending { background: transparent; border: 1px solid var(--neutral); }
  .hyp-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .hyp-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-body); }
  .hyp-legend .lg { width: 8px; height: 8px; border-radius: 50%; }
  .hyp-legend .lg.right { background: var(--success); }
  .hyp-legend .lg.partial { background: var(--attention); }
  .hyp-legend .lg.wrong { background: var(--danger); }
  .hyp-legend .lg.pending { border: 1px solid var(--neutral); }
  .hyp-card .hc-noreason { font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--surface-raised); padding-top: 8px; }
  button.hyp-toggle {
    appearance: none; border: 0; width: 100%; text-align: left; font: inherit; font-size: 13px; line-height: 1.4; cursor: pointer;
  }
  .hyp-broken-list { display: flex; flex-direction: column; gap: 4px; padding: 0 12px; font-size: 13px; color: var(--text-muted); }
  .note-card { display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--surface-raised); border-radius: var(--radius-card); }
  .note-card-title { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .note-card-body { margin: 0; font-size: 13px; line-height: 1.5; color: var(--text-body); white-space: pre-wrap; }
  .share-text { white-space: pre-wrap; margin-top: 4px; color: var(--text-muted); }
  .row-error { margin: 4px 0 0; font-size: 13px; color: var(--danger); }
  .count-hl { font-weight: 500; color: var(--attention); }
  .score { font-weight: 600; color: var(--text-strong); }
  .grade-badge { display: inline-flex; align-items: flex-start; gap: 8px; padding: 2px 8px; border-radius: var(--radius-control); font-size: 13px; font-weight: 500; }
  .grade-badge .dot { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; flex-shrink: 0; background: currentColor; }
  .grade-badge.success { color: var(--success); background: var(--success-tint); }
  .grade-badge.attention { color: var(--attention); background: var(--attention-tint); }
  .grade-badge.danger { color: var(--danger); background: var(--danger-tint); }
  .grade-badge.neutral { color: var(--neutral); background: color-mix(in srgb, var(--neutral) 10%, transparent); }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; align-items: start; }
  .decision-card .dc-why { margin: 0; font-size: 13px; line-height: 1.5; color: var(--text-body); }
  .decision-card .dc-ai {
    padding: 8px 12px;
    border: 1px solid var(--surface-raised);
    border-radius: var(--radius-control);
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-body);
  }
  .decision-card .dc-ai-title { color: var(--text-muted); }
  .decision-card .dc-options { display: flex; flex-direction: column; gap: 8px; }
  .decision-card button.dc-opt {
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 12px;
    border-color: var(--surface-raised);
    background: transparent;
    font: inherit;
    font-size: 13px;
    line-height: 1.4;
    text-align: left;
    cursor: pointer;
  }
  .decision-card button.dc-opt:hover { border-color: var(--text-muted); }
  .decision-card button.dc-opt.picked { border-color: var(--accent); background: var(--surface-raised); }
  .decision-card .dc-radio {
    width: 14px;
    height: 14px;
    box-sizing: border-box;
    flex-shrink: 0;
    border: 2px solid var(--text-muted);
    border-radius: 50%;
  }
  .decision-card .dc-opt.picked .dc-radio { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--surface-raised), inset 0 0 0 7px var(--accent); }
  .decision-card .dc-rec { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--text-muted); }
  .decision-card textarea,
  .decision-card .dc-note-row input,
  .decision-card .dc-note-row select {
    box-sizing: border-box;
    border: 1px solid var(--surface-raised);
    border-radius: var(--radius-control);
    background: var(--surface-raised);
    color: var(--text-strong);
    padding: 8px 12px;
    font-family: inherit;
    font-size: 13px;
  }
  .decision-card textarea { width: 100%; min-height: 64px; resize: vertical; }
  .decision-card textarea[hidden] { display: none; }
  .decision-card .dc-note-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .decision-card .dc-note-row input { flex: 1; min-width: 140px; }
  .decision-card .dc-error[hidden] { display: none; }
  .decision-card .dc-actions { display: flex; align-items: center; gap: 12px; }
  .decision-card .dc-hint { font-size: 12px; color: var(--text-muted); }
  .decision-card.locked .dc-opt { cursor: default; }

  /* ---- 기술 동향 ---- */
  .trend-list { display: flex; flex-direction: column; gap: 12px; }
  .trend-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    border: 1px solid var(--surface-raised);
    border-radius: var(--radius-card);
  }
  .trend-card .tc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .trend-card .tc-title { font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--text-strong); }
  .trend-card.is-read .tc-title { color: var(--text-body); }
  .trend-card .tc-state { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; font-size: 13px; font-weight: 500; }
  .trend-card .tc-state .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .trend-card .tc-state.read { color: var(--success); }
  .trend-card .tc-state.unread { color: var(--attention); }
  .trend-card .tc-summary { margin: 0; font-size: 13px; line-height: 1.5; color: var(--text-body); }
  .trend-card .tc-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 32px; }
  .trend-card .tc-left, .trend-card .tc-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .trend-card .tc-link { display: inline-flex; align-items: center; min-height: 32px; font-size: 13px; color: var(--accent); text-decoration: none; }
  .trend-card .tc-link:hover { text-decoration: underline; }
  .trend-card .tc-link .host { margin-left: 4px; font-family: var(--font-mono); font-size: 12px; }
  .trend-card .tc-plain { font-size: 13px; color: var(--text-muted); word-break: break-all; }
  .trend-card .tc-hint { font-size: 12px; color: var(--text-muted); }
  .trend-card .tc-error { margin: 0; font-size: 13px; color: var(--danger); }
  /* 북마크 버튼 — 꺼짐: PANEL 배경 + RAISED 테두리 + BODY 글자 + MUTED 외곽선 아이콘 / 켜짐: RAISED 배경 + STRONG 글자 + ACCENT 채운 아이콘 */
  .bm-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--surface-raised);
    border-radius: var(--radius-control);
    background: var(--surface-panel);
    color: var(--text-body);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .bm-btn svg { flex-shrink: 0; fill: none; stroke: var(--text-muted); }
  .bm-btn:hover:not(:disabled) { border-color: var(--text-muted); }
  .bm-btn[aria-pressed="true"] { background: var(--surface-raised); color: var(--text-strong); }
  .bm-btn[aria-pressed="true"] svg { fill: var(--accent); stroke: var(--accent); }
  .bm-btn:disabled { color: var(--text-muted); cursor: default; }
  .hm-box {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    border: 1px solid var(--surface-raised);
    border-radius: var(--radius-card);
  }
  .hm-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .hm-head .t { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .hm-head .d { font-size: 12px; color: var(--text-muted); }
  .hm-wrap { display: flex; gap: 8px; overflow-x: auto; }
  .hm-days { display: grid; grid-template-rows: repeat(7, 12px); gap: 3px; padding-top: 19px; font-size: 12px; line-height: 12px; color: var(--text-muted); }
  .hm-main { display: flex; flex-direction: column; gap: 4px; }
  .hm-months, .hm-grid { display: grid; grid-auto-flow: column; grid-auto-columns: 12px; gap: 3px; }
  .hm-months { grid-template-rows: 15px; font-size: 12px; line-height: 15px; color: var(--text-muted); }
  .hm-months span { white-space: nowrap; overflow: visible; }
  .hm-grid { grid-template-rows: repeat(7, 12px); }
  .hm-cell { width: 12px; height: 12px; box-sizing: border-box; border-radius: 2px; border: 1px solid transparent; }
  /* 잔디 4단계(읽은 건수 0 · 1 · 2 · 3) — 보드 Trends1Today의 값. 새 토큰 이름 없음 */
  .hm-cell.l0 { background: var(--surface-raised); border-color: var(--surface-raised); }
  .hm-cell.l1 { background: color-mix(in srgb, var(--success) 40%, transparent); }
  .hm-cell.l2 { background: color-mix(in srgb, var(--success) 70%, transparent); }
  .hm-cell.l3 { background: var(--success); }
  .hm-legend { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-muted); }
  .hm-legend .hm-cell { margin: 0 1px; }

  /* 안 읽은 글 · 북마크 줄 목록 */
  .tr-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--surface-raised); border-radius: var(--radius-card); }
  .tr-head, .tr-row { display: grid; align-items: center; column-gap: 16px; padding: 12px 16px; }
  .tr-list.unread .tr-head, .tr-list.unread .tr-row { grid-template-columns: 96px minmax(0, 1fr) 200px 112px; }
  .tr-list.marks .tr-head, .tr-list.marks .tr-row { grid-template-columns: 96px minmax(0, 1fr) 88px 200px 112px; }
  .tr-head { font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--surface-raised); }
  .tr-head .tr-bm { justify-self: end; }
  .tr-row + .tr-row { border-top: 1px solid var(--surface-raised); }
  .tr-row .tr-date { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
  .tr-row .tr-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .tr-row .tr-title { font-size: 14px; font-weight: 600; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr-row .tr-sum { font-size: 13px; color: var(--text-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr-row .tr-state { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
  .tr-row .tr-state .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .tr-row .tr-state.read { color: var(--success); }
  .tr-row .tr-state.unread { color: var(--attention); }
  .tr-row .tc-link { display: inline-flex; align-items: center; min-height: 32px; font-size: 13px; color: var(--accent); text-decoration: none; white-space: nowrap; }
  .tr-row .tc-link:hover { text-decoration: underline; }
  .tr-row .tc-link .host { margin-left: 4px; font-family: var(--font-mono); font-size: 12px; }
  .tr-row .tc-plain { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
  .tr-row .tc-error { grid-column: 2 / -1; margin: 8px 0 0; font-size: 13px; color: var(--danger); }
  .tr-row .tr-bm { justify-self: end; }
  .tr-note { margin: 0 0 12px; font-size: 12px; color: var(--text-muted); }
  .tr-chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .tr-chip {
    height: 32px; padding: 0 12px;
    border: 1px solid var(--surface-raised); border-radius: var(--radius-control);
    background: var(--surface-panel); color: var(--text-body);
    font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .tr-chip:hover { border-color: var(--text-muted); }
  .tr-chip[aria-pressed="true"] { background: var(--surface-raised); color: var(--text-strong); }
  .tr-counts { font-size: 12px; color: var(--text-muted); margin-left: 4px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
