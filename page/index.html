<script>
(function () {
  "use strict";

  var POLL_MS = 15000;

  var NOTE_KIND_LABEL = {
    reason: "이유",
    scope: "범위 바뀜",
    new: "새 일"
  };

  // ---- 탭 전환(클라이언트 쪽에서만, 새 요청 없음) ----

  var menuEl = document.getElementById("menu");
  var menuToggle = document.getElementById("menu-toggle");
  var compParent = document.getElementById("comp-parent");
  var subComp = document.getElementById("sub-comp");
  var trendsParent = document.getElementById("trends-parent");
  var subTrends = document.getElementById("sub-trends");
  // 펼침 그룹: 부모 버튼 + 하위 목록. 3역량과 기술 동향이 같은 규칙을 쓴다.
  var menuGroups = {
    comp: { parent: compParent, list: subComp },
    trends: { parent: trendsParent, list: subTrends }
  };
  var tabItems = document.querySelectorAll(".menu-item[data-tab]");
  var panels = {
    track: document.getElementById("tab-track"),
    judge: document.getElementById("tab-judge"),
    review: document.getElementById("tab-review"),
    comp: document.getElementById("tab-comp"),
    weekly: document.getElementById("tab-weekly"),
    health: document.getElementById("tab-health"),
    routine: document.getElementById("tab-routine"),
    trends: document.getElementById("tab-trends")
  };
  var activeTab = "track";
  var activeSub = "workflow";
  var trendsSub = "today"; // today | unread | bookmarks

  // 접힘 · 그룹 펼침 상태는 세션 중 메모리만 쓴다(localStorage 없음).
  function setGroupOpen(key, open) {
    var g = menuGroups[key];
    g.list.hidden = !open;
    g.parent.setAttribute("aria-expanded", open ? "true" : "false");
  }

  function setCollapsed(collapsed) {
    menuEl.classList.toggle("collapsed", collapsed);
    menuToggle.setAttribute("aria-label", collapsed ? "메뉴 펼치기" : "메뉴 접기");
    menuToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
  }

  // 선택 면은 항목 하나뿐이다. 그룹(3역량 · 기술 동향)은 하위 항목이 선택 면을 갖고 부모는 글자만 올린다.
  function syncMenu() {
    tabItems.forEach(function (b) {
      var tab = b.getAttribute("data-tab");
      var sub = b.getAttribute("data-sub");
      var cur = tab === "trends" ? trendsSub : activeSub;
      var on = tab === activeTab && (!sub || sub === cur);
      if (on) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
    Object.keys(menuGroups).forEach(function (key) {
      menuGroups[key].parent.classList.toggle("parent-active", activeTab === key);
    });
  }

  function selectTab(target, sub) {
    activeTab = target;
    if (sub) {
      if (target === "trends") trendsSub = sub;
      else activeSub = sub;
    }
    Object.keys(panels).forEach(function (key) {
      panels[key].hidden = key !== target;
    });
    if (menuGroups[target]) setGroupOpen(target, true);
    syncMenu();
    // 기술 동향은 받아 둔 응답이 있으면 하위 항목 전환을 바로 그린다(새 요청은 아래 loadVisibleExtra).
    if (target === "trends" && lastExtra.trends) renderTrends(lastExtra.trends);
    // 회고는 탭이 선택될 때만 rollover(POST) 뒤 GET. 폴링은 GET만(loadVisibleExtra).
    if (target === "routine") fetchRoutine(true);
    else loadVisibleExtra();
  }

  tabItems.forEach(function (btn) {
    btn.addEventListener("click", function () {
      selectTab(btn.getAttribute("data-tab"), btn.getAttribute("data-sub"));
    });
  });

  menuToggle.addEventListener("click", function () {
    setCollapsed(!menuEl.classList.contains("collapsed"));
  });

  Object.keys(menuGroups).forEach(function (key) {
    menuGroups[key].parent.addEventListener("click", function () {
      if (menuEl.classList.contains("collapsed")) {
        setCollapsed(false);
        setGroupOpen(key, true);
        return;
      }
      setGroupOpen(key, menuGroups[key].list.hidden);
    });
  });

  // ---- 배너(에러 안내) ----

  var bannerEl = document.getElementById("banner");
  var bannerTimer = null;

  function showBanner(text, ms) {
    bannerEl.textContent = text;
    bannerEl.hidden = false;
    if (bannerTimer) clearTimeout(bannerTimer);
    if (ms !== 0) {
      bannerTimer = setTimeout(function () {
        bannerEl.hidden = true;
      }, ms || 6000);
    }
  }

  // ---- 공용 ----

  function minutesAgoText(lastAt) {
    if (typeof lastAt !== "number") return "";
    var secs = Date.now() / 1000 - lastAt;
    if (secs < 0) secs = 0;
    var mins = Math.floor(secs / 60);
    if (mins < 1) return "방금 전";
    return mins + "분 전";
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === "class") node.className = attrs[k];
        else if (k === "text") node.textContent = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) {
      if (c) node.appendChild(c);
    });
    return node;
  }

  // ---- 화면 머리(제목 + 한 줄 설명) ----

  function pageHead(title, desc) {
    return el("div", { class: "page-head" }, [
      el("h1", { text: title }),
      el("p", { text: desc })
    ]);
  }

  // ---- 트랙 탭 ----
  // 서버(desk.sort.sort_sessions)가 이미 정렬한 순서를 그대로 쓴다(재정렬하지 않음).
  // 표 구조: 상태(점 + 라벨) · 레포 · 브랜치 · 마지막 신호.

  var trackState = { sessions: null, error: false, repo: null };

  function renderTrack() {
    var container = document.getElementById("track-content");
    clear(container);
    container.className = "screen";
    container.appendChild(pageHead("트랙", "지금 도는 세션과 사람이 움직일 차례를 한눈에 본다."));

    var sessions = trackState.sessions;
    if (trackState.error) {
      container.appendChild(inlineNote("불러오지 못했다: 마지막으로 받은 값을 보여 준다. 15초 뒤 다시 시도한다", "danger"));
    }

    var cols = [
      { name: "상태", width: "170px" },
      { name: "레포 · 브랜치", width: "minmax(0, 1fr)" },
      { name: "마지막 신호", width: "110px" }
    ];

    if (sessions === null) {
      container.appendChild(dataTable(cols, []));
      container.appendChild(waitLine("불러오는 중…"));
      return;
    }
    if (sessions.length === 0) {
      container.appendChild(emptyStateCard("지금 도는 세션 없음", "세션이 시작되면 이 자리에 나타난다."));
      return;
    }

    var repos = [];
    sessions.forEach(function (s) {
      var repo = s.repo || "(알수없음)";
      if (repos.indexOf(repo) === -1) repos.push(repo);
    });
    if (trackState.repo !== null && repos.indexOf(trackState.repo) === -1) trackState.repo = null;

    var chipRow = el("div", { class: "chip-row" });
    var repoChip = chip("레포", trackState.repo === null ? "전체" : trackState.repo);
    repoChip.setAttribute("aria-label", "레포 필터: 누르면 다음 레포로 바뀐다");
    repoChip.addEventListener("click", function () {
      var order = [null].concat(repos);
      var next = order[(order.indexOf(trackState.repo) + 1) % order.length];
      trackState.repo = next;
      renderTrack();
    });
    chipRow.appendChild(repoChip);
    container.appendChild(chipRow);

    var rows = [];
    sessions.forEach(function (s) {
      var repo = s.repo || "(알수없음)";
      if (trackState.repo !== null && repo !== trackState.repo) return;
      var effStatus = s.effectiveStatus || s.status || "";
      rows.push([
        statusDotLabel(effStatus),
        el("div", { class: "mono" }, [
          el("div", { text: repo }),
          el("div", { text: s.branch || "" })
        ]),
        el("span", { class: "muted", text: minutesAgoText(s.lastAt) })
      ]);
    });
    container.appendChild(dataTable(cols, rows));
  }

  function renderSessions(sessions) {
    trackState.sessions = sessions || [];
    trackState.error = false;
    renderTrack();
  }

  function fetchSessions() {
    fetch("/sessions")
      .then(function (res) {
        if (!res.ok) throw new Error("sessions " + res.status);
        return res.json();
      })
      .then(renderSessions)
      .catch(function () {
        // 화면을 지우지 않고 안내 한 줄만 올린다. 다음 polling에서 다시 시도한다.
        trackState.error = true;
        renderTrack();
      });
  }

  // ---- 판정 탭 ----
  // 반영 전에는 다시 고를 수 있고, 반영된 카드는 선택지 · 버튼 없이 잠금 문장만 둔다.
  // 15초 폴링이 화면을 다시 그려도 고른 것 · 쓰던 글이 사라지지 않게 카드별 초안을 메모리에 둔다.

  var judgeState = { cards: null, error: false };
  var drafts = {};

  function draftKey(card) {
    return card.repo + "\u0000" + card.id;
  }

  function getDraft(card) {
    var key = draftKey(card);
    if (!drafts[key]) {
      var pick = card.pick || {};
      drafts[key] = {
        choice: pick.choice || null,
        customText: pick.choice === "custom" ? (pick.customText || "") : "",
        note: pick.note || "",
        noteKind: pick.noteKind || "",
        error: "",
        saving: false
      };
    }
    return drafts[key];
  }

  function buildAiDecided(card) {
    var parts = (card.aiDecided || []).map(function (entry) { return entry.label; });
    if (card.premiseOpen) parts.push("전제 열림");
    if (parts.length === 0) return null;
    return el("div", { class: "dc-ai" }, [
      el("span", { class: "dc-ai-title", text: "AI가 이미 정한 것" }),
      el("span", { text: " · " + parts.join(" · ") })
    ]);
  }

  function pickedLabel(card) {
    if (!card.pick) return "";
    if (card.pick.choice === "custom") return "직접 쓰기 — " + (card.pick.customText || "");
    var opt = (card.options || []).find(function (o) { return o.key === card.pick.choice; });
    return opt ? opt.label : String(card.pick.choice);
  }

  function buildCard(card) {
    var locked = !!card.applied;
    var draft = getDraft(card);
    var meta = card.repo + (card.area ? " · " + card.area : "");
    var kids = [
      el("div", { class: "dc-head" }, [
        el("div", {}, [
          el("div", { class: "dc-title", text: card.question || "" }),
          el("div", { class: "dc-meta", text: meta })
        ]),
        statusDotLabel(locked ? "반영됨" : "승인 대기", locked ? "success" : "attention")
      ])
    ];
    if (card.why) kids.push(el("p", { class: "dc-why", text: "이유: " + card.why }));
    if (card.see && card.see.length > 0) {
      kids.push(el("p", { class: "dc-why", text: "참고: " + card.see.join(", ") }));
    }
    var aiBox = buildAiDecided(card);
    if (aiBox) kids.push(aiBox);

    if (locked) {
      if (card.pick) kids.push(el("div", { class: "dc-opt picked", text: pickedLabel(card) }));
      kids.push(el("p", { class: "dc-lock", text: "반영된 판정은 바꿀 수 없다." }));
      if (card.applied.issue) {
        kids.push(el("p", { class: "dc-lock" }, [
          el("a", { href: card.applied.issue, target: "_blank", rel: "noopener", text: card.applied.issue })
        ]));
      }
      return el("div", { class: "decision-card locked" }, kids);
    }

    var errorEl = el("p", { class: "dc-error", text: draft.error });
    errorEl.hidden = !draft.error;
    var textarea = el("textarea", { placeholder: "직접 쓰기", "aria-label": "직접 쓰기" });
    var noteInput = el("input", { type: "text", placeholder: "메모(선택)", "aria-label": "메모" });
    var noteKindSelect = el("select", { "aria-label": "메모 종류" });
    [["", "메모 종류"], ["reason", "이유"], ["scope", "범위 바뀜"], ["new", "새 일"]].forEach(function (pair) {
      noteKindSelect.appendChild(el("option", { value: pair[0], text: pair[1] }));
    });
    textarea.value = draft.customText;
    noteInput.value = draft.note;
    noteKindSelect.value = draft.noteKind;
    textarea.addEventListener("input", function () { draft.customText = textarea.value; });
    noteInput.addEventListener("input", function () { draft.note = noteInput.value; });
    noteKindSelect.addEventListener("change", function () { draft.noteKind = noteKindSelect.value; });

    var submitBtn = button("반영", null, "accent");
    var hint = el("span", { class: "dc-hint" });

    function syncActions() {
      submitBtn.disabled = !draft.choice || draft.saving;
      submitBtn.textContent = draft.choice ? "반영" : "반영 (선택 필요)";
      hint.textContent = draft.saving ? "저장 중…" : (draft.choice ? "반영 전에는 다시 고를 수 있다" : "선택지를 고르면 반영할 수 있다");
      textarea.hidden = draft.choice !== "custom";
    }

    var optionsEl = el("div", { class: "dc-options", role: "radiogroup", "aria-label": "선택지" });
    var optionBtns = [];
    var choices = (card.options || []).map(function (o) {
      return { key: o.key, label: o.label, rec: !!o.recommended };
    });
    choices.push({ key: "custom", label: "직접 쓰기", rec: false });
    choices.forEach(function (c) {
      var b = el("button", { class: "dc-opt", type: "button", role: "radio" }, [
        el("span", { class: "dc-radio", "aria-hidden": "true" }),
        el("span", { text: c.label }),
        c.rec ? el("span", { class: "dc-rec", text: "추천" }) : null
      ]);
      b.addEventListener("click", function () {
        draft.choice = c.key;
        paintOptions();
        syncActions();
      });
      optionBtns.push({ btn: b, key: c.key });
      optionsEl.appendChild(b);
    });
    function paintOptions() {
      optionBtns.forEach(function (o) {
        var on = draft.choice === o.key;
        o.btn.classList.toggle("picked", on);
        o.btn.setAttribute("aria-checked", on ? "true" : "false");
      });
    }

    submitBtn.addEventListener("click", function () {
      if (!draft.choice) return;
      if (draft.choice === "custom") {
        var text = textarea.value.trim();
        if (!text) {
          draft.error = "직접 쓰기 칸이 비어 있습니다.";
          errorEl.textContent = draft.error;
          errorEl.hidden = false;
          return;
        }
        submitPick(card, { choice: "custom", customText: text }, noteInput, noteKindSelect, errorEl, draft, syncActions);
        return;
      }
      submitPick(card, { choice: draft.choice }, noteInput, noteKindSelect, errorEl, draft, syncActions);
    });

    kids.push(optionsEl);
    kids.push(textarea);
    kids.push(el("div", { class: "dc-note-row" }, [noteInput, noteKindSelect]));
    kids.push(errorEl);
    kids.push(el("div", { class: "dc-actions" }, [submitBtn, hint]));
    paintOptions();
    syncActions();
    return el("div", { class: "decision-card" }, kids);
  }

  function submitPick(card, fields, noteInput, noteKindSelect, errorEl, draft, syncActions) {
    var body = { repo: card.repo, id: card.id, choice: fields.choice };
    if (fields.customText !== undefined) body.customText = fields.customText;

    var noteVal = noteInput ? noteInput.value.trim() : "";
    if (noteVal) {
      body.note = noteVal;
      body.noteKind = noteKindSelect ? noteKindSelect.value : "";
    }

    function fail(msg) {
      // 저장 실패는 그 카드 안 한 줄로. 입력(선택 · 글)은 초안에 그대로 남는다.
      draft.saving = false;
      draft.error = msg;
      errorEl.textContent = msg;
      errorEl.hidden = false;
      syncActions();
    }

    draft.saving = true;
    draft.error = "";
    errorEl.hidden = true;
    syncActions();

    fetch("/pick", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Desk-Token": DESK_TOKEN
      },
      body: JSON.stringify(body)
    })
      .then(function (res) {
        if (res.status === 200) {
          delete drafts[draftKey(card)];
          fetchJudgments();
          return;
        }
        if (res.status === 409) {
          delete drafts[draftKey(card)];
          showBanner("이미 반영된 판정입니다 — 화면을 새로 불러옵니다.");
          fetchJudgments();
          return;
        }
        if (res.status === 403) {
          draft.saving = false;
          syncActions();
          showBanner("토큰이 맞지 않습니다 — 서버가 다시 떠서 토큰이 바뀌었을 수 있습니다. 새로고침 해주세요.", 0);
          return;
        }
        return res.json().then(function (data) {
          var msg = (data && data.violations && data.violations.join(", ")) || "저장하지 못했습니다.";
          fail("저장하지 못했다: " + msg + " 입력한 내용은 그대로 두었다.");
        });
      })
      .catch(function () {
        fail("저장하지 못했다: 서버에 연결되지 않았다. 입력한 내용은 그대로 두었다. 다시 반영을 눌러 재시도한다.");
      });
  }

  function renderJudge() {
    var container = document.getElementById("judge-content");
    // 글을 쓰는 중이면 폴링이 입력칸을 지우지 않도록 다음 주기로 미룬다.
    var active = document.activeElement;
    if (active && container.contains(active) && (active.tagName === "TEXTAREA" || active.tagName === "INPUT" || active.tagName === "SELECT")) return;

    clear(container);
    container.className = "screen";
    container.appendChild(pageHead("판정", "지휘가 올린 질문에 고르거나 직접 쓴다. 반영된 판정은 잠긴다."));

    if (judgeState.error) {
      container.appendChild(inlineNote("불러오지 못했다: 마지막으로 받은 값을 보여 준다. 15초 뒤 다시 시도한다", "danger"));
    }
    var cards = judgeState.cards;
    if (cards === null) {
      container.appendChild(waitLine("불러오는 중…"));
      return;
    }
    if (cards.length === 0) {
      container.appendChild(emptyStateCard("판정 대기 카드 없음", "새 카드가 올라오면 이 자리에 나타난다."));
      return;
    }
    var grid = el("div", { class: "card-grid" });
    cards.forEach(function (card) {
      grid.appendChild(buildCard(card));
    });
    container.appendChild(grid);
  }

  function renderJudgments(cards) {
    judgeState.cards = cards || [];
    judgeState.error = false;
    renderJudge();
  }

  function fetchJudgments() {
    fetch("/judgments")
      .then(function (res) {
        if (!res.ok) throw new Error("judgments " + res.status);
        return res.json();
      })
      .then(renderJudgments)
      .catch(function () {
        judgeState.error = true;
        renderJudge();
      });
  }

  // ---- 확장 탭(복습함 · 3역량 · 주간 롤업 · 레포 건강도) ----
  // 서버가 준 문자열은 원장의 임의 텍스트다 — 전부 el()의 textContent로만 넣는다.
  // 정렬 · 분류는 서버가 한 순서 그대로 그린다.

  var AREA_LABEL = { fe: "FE", be: "BE", infra: "infra", domain: "도메인", "미분류": "미분류" };

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  // ---- 공통 컴포넌트 빌더 (DESIGN.md §5). 데이터는 textContent로만 ----
  // 상태 이름 → 의미색(accent|attention|success|danger|neutral). 한 곳에서만 정한다.
  var STATUS_TONE = {
    "작업 중": "accent",
    "승인 대기": "attention",
    "입력 대기": "attention",
    "막힘": "danger",
    "완료": "success",
    "정상": "success",
    "신호 없음": "neutral",
    "경로 없음": "neutral",
    "파일 없음": "neutral",
    "채점 없음": "neutral",
    "형식 확인 필요": "attention"
  };

  function statusDotLabel(label, tone) {
    var t = tone || STATUS_TONE[label] || "neutral";
    return el("span", { class: "status-dot-label " + t }, [
      el("span", { class: "dot", "aria-hidden": "true" }),
      el("span", { text: label })
    ]);
  }

  function chip(label, value) {
    return el("button", { class: "chip", type: "button" }, [
      el("span", { class: "chip-label", text: label }),
      el("span", { class: "chip-sep", "aria-hidden": "true" }),
      el("span", { class: "chip-value", text: value })
    ]);
  }

  // cols: [{ name, width }] width는 grid 열 폭(예 "160px", "minmax(0, 1fr)").
  // rows: 셀 배열의 배열. 셀은 문자열 또는 DOM 노드.
  function dataTable(cols, rows) {
    var table = el("div", { class: "data-table", role: "table" });
    table.style.setProperty("--dt-cols", cols.map(function (c) { return c.width || "minmax(0, 1fr)"; }).join(" "));
    var head = el("div", { class: "dt-head", role: "row" }, cols.map(function (c) {
      return el("span", { role: "columnheader", tabindex: "0", "data-tooltip": c.name, text: c.name });
    }));
    table.appendChild(head);
    (rows || []).forEach(function (cells) {
      table.appendChild(el("div", { class: "dt-row", role: "row" }, cells.map(function (cell) {
        var td = el("div", { class: "cell", role: "cell" });
        if (cell && typeof cell === "object" && cell.nodeType) td.appendChild(cell);
        else td.textContent = cell == null ? "" : String(cell);
        return td;
      })));
    });
    return table;
  }

  // delta가 없으면 자리째 숨긴다. deltaTone: danger | success | 없음(text-muted)
  function kpiTile(label, value, delta, deltaTone) {
    var kids = [
      el("span", { class: "kpi-label", text: label }),
      el("span", { class: "kpi-value", text: String(value) })
    ];
    if (delta) kids.push(el("span", { class: "kpi-delta" + (deltaTone ? " " + deltaTone : ""), text: delta }));
    return el("div", { class: "kpi-tile" }, kids);
  }

  // 판정 카드 뼈대. opts: { title, meta, status, tone, options:[{text, rec, picked}], lockText, errorText }
  // 반영 뒤(lockText)에는 선택지를 그리지 않고 잠금 문장만 둔다.
  function decisionCard(opts) {
    var kids = [
      el("div", { class: "dc-head" }, [
        el("div", {}, [
          el("div", { class: "dc-title", text: opts.title || "" }),
          opts.meta ? el("div", { class: "dc-meta", text: opts.meta }) : null
        ]),
        opts.status ? statusDotLabel(opts.status, opts.tone) : null
      ])
    ];
    if (opts.lockText) {
      kids.push(el("p", { class: "dc-lock", text: opts.lockText }));
    } else {
      (opts.options || []).forEach(function (o) {
        var cls = "dc-opt" + (o.rec ? " rec" : "") + (o.picked ? " picked" : "");
        kids.push(el("div", { class: cls, text: o.text }));
      });
    }
    if (opts.errorText) kids.push(el("p", { class: "dc-error", text: opts.errorText }));
    return el("div", { class: "decision-card" }, kids);
  }

  function emptyStateCard(reason, next) {
    return el("div", { class: "empty-state-card" }, [
      el("span", { class: "dot", "aria-hidden": "true" }),
      el("span", { class: "esc-title", text: reason }),
      next ? el("span", { class: "esc-next", text: next }) : null
    ]);
  }

  // tone: neutral | attention | danger
  function inlineNote(text, tone) {
    return el("p", { class: "inline-note" + (tone && tone !== "neutral" ? " " + tone : "") }, [
      el("span", { class: "dot", "aria-hidden": "true" }),
      el("span", { text: text })
    ]);
  }

  function waitLine(text) {
    return el("p", { class: "wait-line", text: text || "불러오는 중" });
  }

  // variant: "accent"(강조) | 없음(기본). small: 표 행 안 작은 버튼
  function button(text, onClick, variant, small) {
    var cls = "btn" + (variant === "accent" ? " accent" : "") + (small ? " sm" : "");
    var b = el("button", { class: cls, type: "button", text: text });
    if (onClick) b.addEventListener("click", onClick);
    return b;
  }

  // 확인 단계 있는 위험 동작: 첫 클릭은 라벨을 확인 문구로 바꾸고, 3초 안에 다시 눌러야 실행
  function confirmButton(text, confirmText, onConfirm, small) {
    var armed = false;
    var timer = null;
    var b = button(text, null, null, small);
    b.addEventListener("click", function () {
      if (!armed) {
        armed = true;
        b.textContent = confirmText;
        b.classList.add("confirm-pending");
        timer = setTimeout(reset, 3000);
        return;
      }
      reset();
      onConfirm();
    });
    function reset() {
      armed = false;
      if (timer) clearTimeout(timer);
      b.textContent = text;
      b.classList.remove("confirm-pending");
    }
    return b;
  }

  // 표 행 맨 앞 틴트 없는 상태 라벨 = statusDotLabel. 툴팁은 CSS([data-tooltip]) + 포커스 가능 헤더.

  function postMark(path, body, done, onError) {
    function fail(msg) {
      if (onError) onError(msg);
      else showBanner(msg);
    }
    fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Desk-Token": DESK_TOKEN },
      body: JSON.stringify(body)
    })
      .then(function (res) {
        if (res.status === 200) { done(); return; }
        if (res.status === 403) {
          showBanner("토큰이 맞지 않습니다 — 서버가 다시 떠서 토큰이 바뀌었을 수 있습니다. 새로고침 해주세요.", 0);
          if (onError) onError("토큰이 맞지 않아 저장하지 못했다");
          return;
        }
        fail("저장하지 못했다");
      })
      .catch(function () {
        fail("네트워크 오류로 저장하지 못했다");
      });
  }

  // ---- 확장 화면 공통 ----

  // config 안내(폴백 · 설정 없음 · 미등록 · 오류) = inline-note 배열
  function cfgNotes(config) {
    var notes = [];
    if (!config) return notes;
    if (config.source === "conductor") notes.push(inlineNote("폴백 사용 중", "neutral"));
    if (config.source === "none") notes.push(inlineNote("설정 없음: 레포를 설정 파일에 등록하면 항목이 나타난다", "attention"));
    if (config.unregistered && config.unregistered.length > 0) {
      notes.push(inlineNote("미등록 레포 " + config.unregistered.length + "개: " + config.unregistered.join(", "), "attention"));
    }
    if (config.error) notes.push(inlineNote(String(config.error), "danger"));
    return notes;
  }

  // missing 행은 숨기지 않는다: 상태(점 + 라벨) · 레포 · 대상
  function missingTable(list) {
    var rows = (list || []).map(function (m) {
      return [
        statusDotLabel(String(m.missing || "확인 필요")),
        el("span", { class: "mono", text: m.repo || "" }),
        el("span", { class: "muted", text: m.what || "" })
      ];
    });
    if (rows.length === 0) return null;
    return dataTable([
      { name: "상태", width: "170px" },
      { name: "레포", width: "180px" },
      { name: "대상", width: "minmax(0, 1fr)" }
    ], rows);
  }

  function screenBox(id, title, desc, config) {
    var box = document.getElementById(id);
    clear(box);
    box.className = "screen";
    box.appendChild(pageHead(title, desc));
    cfgNotes(config).forEach(function (n) { box.appendChild(n); });
    return box;
  }

  function sectionTitle(text) {
    return el("h2", { class: "section-title", text: text });
  }

  // 레포 필터 칩: 누르면 다음 레포로 순환(트랙 화면과 같은 방식)
  var extraRepo = { review: null, workflow: null, fullstack: null };
  function repoFilterChip(key, repos, rerender) {
    if (extraRepo[key] !== null && repos.indexOf(extraRepo[key]) === -1) extraRepo[key] = null;
    var c = chip("레포", extraRepo[key] === null ? "전체" : extraRepo[key]);
    c.setAttribute("aria-label", "레포 필터: 누르면 다음 레포로 바뀐다");
    c.addEventListener("click", function () {
      var order = [null].concat(repos);
      extraRepo[key] = order[(order.indexOf(extraRepo[key]) + 1) % order.length];
      rerender();
    });
    return el("div", { class: "chip-row" }, [c]);
  }

  function uniq(list) {
    var out = [];
    list.forEach(function (v) { if (v && out.indexOf(v) === -1) out.push(v); });
    return out;
  }

  var lastExtra = { review: null, comp: null, routine: null, trends: null };
  var reviewErrors = {};

  function renderReview(data) {
    lastExtra.review = data;
    var box = screenBox("review-content", "복습함", "복습할 항목을 확인하고 반영한다.", data.config);
    var items = data.items || [];
    var missing = data.missing || [];
    if (items.length === 0 && missing.length === 0) {
      box.appendChild(emptyStateCard("복습할 항목 없음", "새 항목이 생기면 이 자리에 나타난다."));
      return;
    }
    if (items.length > 0) {
      box.appendChild(repoFilterChip("review", uniq(items.map(function (i) { return i.repo; })), function () { renderReview(data); }));
      var rows = [];
      items.forEach(function (it) {
        if (extraRepo.review !== null && it.repo !== extraRepo.review) return;
        var errKey = it.repo + "\u0000" + it.key;
        var title = it.kind === "phase" ? "이해 증명 건너뜀 · " + it.title : it.title;
        var info = [it.card_kind, it.where].filter(Boolean).join(" · ");
        var cellKids = [el("div", { text: title })];
        if (it.summary) cellKids.push(el("div", { class: "muted", text: it.summary }));
        if (reviewErrors[errKey]) cellKids.push(el("p", { class: "row-error", text: reviewErrors[errKey] }));
        var btn = button("복습함 반영", function () {
          postMark("/review/done", { repo: it.repo, key: it.key }, function () {
            delete reviewErrors[errKey];
            fetchExtra("review");
          }, function (msg) {
            reviewErrors[errKey] = msg;
            renderReview(data);
          });
        }, "accent", true);
        rows.push([
          it.status ? statusDotLabel(it.status) : el("span", { class: "muted", text: "" }),
          el("div", {}, cellKids),
          el("span", { class: "mono", text: it.repo || "" }),
          el("span", { class: "muted", text: info }),
          btn
        ]);
      });
      box.appendChild(dataTable([
        { name: "상태", width: "130px" },
        { name: "항목", width: "minmax(0, 1fr)" },
        { name: "레포", width: "150px" },
        { name: "종류 · 위치", width: "170px" },
        { name: "반영", width: "110px" }
      ], rows));
    }
    var mt = missingTable(missing);
    if (mt) {
      box.appendChild(sectionTitle("확인하지 못한 레포"));
      box.appendChild(mt);
    }
  }

  var COMP_HEAD = {
    workflow: ["AI워크플로우", "반복되는 패턴을 횟수순으로 본다. 3회 이상은 강조한다."],
    proactive: ["적극성", "기준 메모, 소요시간, 임팩트 링크, 미반영 공유 파일을 본다."],
    fullstack: ["풀스택", "영역별 학습 카드를 복습 순서로 본다."]
  };

  function renderWorkflow(box, data, rerender) {
    var rows = data.rows || [];
    var missing = data.missing || [];
    if (rows.length === 0 && missing.length === 0) {
      box.appendChild(emptyStateCard("열린 패턴 없음", "반복이 쌓이면 이 자리에 나타난다."));
      return;
    }
    if (rows.length > 0) {
      box.appendChild(repoFilterChip("workflow", uniq(rows.map(function (r) { return r.repo; })), rerender));
      var trs = [];
      rows.forEach(function (r) {
        if (extraRepo.workflow !== null && r.repo !== extraRepo.workflow) return;
        if (r.unparsed) {
          trs.push([statusDotLabel("형식 확인 필요"), el("span", { class: "muted", text: "" }), "", "", ""]);
          return;
        }
        var count = r.count === null || r.count === undefined ? "?" : String(r.count);
        var countNode = el("span", { class: r.highlight ? "count-hl" : "", text: count });
        trs.push([
          el("div", {}, [
            el("div", { text: r.pattern || "" }),
            el("div", { class: "muted", text: [r.source, r.repo].filter(Boolean).join(" · ") })
          ]),
          el("span", { text: [r.kind, r.status].filter(Boolean).join(" · ") }),
          countNode,
          el("span", { class: "muted", text: r.last || "" })
        ]);
      });
      // 형식 확인 필요 행은 4열에 맞춰 상태를 첫 칸에 둔다
      trs = trs.map(function (cells) { return cells.length === 5 ? [cells[0], "", "", ""] : cells; });
      box.appendChild(dataTable([
        { name: "패턴", width: "minmax(0, 1fr)" },
        { name: "종류", width: "160px" },
        { name: "횟수", width: "70px" },
        { name: "마지막", width: "110px" }
      ], trs));
    }
    var mt = missingTable(missing);
    if (mt) { box.appendChild(sectionTitle("확인하지 못한 레포")); box.appendChild(mt); }
  }

  function renderProactive(box, data) {
    var crit = data.criteria || {};
    var memo = crit.text !== null && crit.text !== undefined ? crit.text : (crit.note || "설정 없음");
    box.appendChild(el("div", { class: "note-card" }, [
      el("span", { class: "note-card-title", text: "기준 메모" }),
      el("p", { class: "note-card-body", text: memo })
    ]));

    var speed = data.speed || {};
    box.appendChild(sectionTitle("스피드"));
    var durRows = (speed.durations || []).map(function (d) {
      return [d.task, el("span", { class: "mono", text: d.repo }), d.minutes + "분"];
    });
    if (durRows.length > 0) {
      box.appendChild(dataTable([
        { name: "작업", width: "minmax(0, 1fr)" },
        { name: "레포", width: "160px" },
        { name: "소요시간", width: "110px" }
      ], durRows));
    }
    if (speed.no_data) box.appendChild(inlineNote("시간 기록 없음 " + speed.no_data + "건", "neutral"));
    if (speed.metric2) box.appendChild(el("p", { class: "muted-line", text: speed.metric2 }));
    box.appendChild(el("div", { class: "chip-row" }, [
      button("AI워크플로우 보기", function () { selectTab("comp", speed.workflow_link || "workflow"); }, null, true)
    ]));

    var impact = data.impact || {};
    box.appendChild(sectionTitle("임팩트"));
    var prdRows = (impact.prds || []).map(function (p) {
      return [p.task, el("span", { class: "mono", text: p.repo }), el("span", { class: "mono", text: p.prd })];
    });
    if (prdRows.length > 0) {
      box.appendChild(dataTable([
        { name: "작업", width: "minmax(0, 1fr)" },
        { name: "레포", width: "160px" },
        { name: "PRD", width: "220px" }
      ], prdRows));
    }
    if (Array.isArray(impact.evidence)) {
      if (impact.evidence.length === 0) {
        box.appendChild(inlineNote("최근 갱신분 없음", "neutral"));
      } else {
        box.appendChild(dataTable([
          { name: "최근 갱신분", width: "minmax(0, 1fr)" },
          { name: "레포", width: "160px" }
        ], impact.evidence.map(function (e) {
          return [el("span", { class: "mono", text: e.path }), el("span", { class: "mono", text: e.repo })];
        })));
      }
    } else {
      box.appendChild(inlineNote((impact.evidence && impact.evidence.note) || "경로 미설정", "attention"));
    }

    box.appendChild(sectionTitle("투명성"));
    var tr = data.transparency || [];
    if (tr.length === 0) {
      box.appendChild(inlineNote("미반영 공유 파일 없음", "neutral"));
    } else {
      box.appendChild(dataTable([
        { name: "공유 파일", width: "minmax(0, 1fr)" },
        { name: "복사", width: "90px" },
        { name: "공유함", width: "100px" }
      ], tr.map(function (t) {
        var copy = button("복사", function () {
          if (!navigator.clipboard) { showBanner("이 브라우저에서는 복사할 수 없습니다."); return; }
          navigator.clipboard.writeText(t.text).then(function () {
            showBanner("복사했습니다.", 2000);
          }, function () {
            showBanner("복사하지 못했습니다.");
          });
        }, null, true);
        var shared = button("공유함", function () {
          postMark("/share/shared", { repo: t.repo, id: t.id }, function () {
            fetchExtra("comp");
          });
        }, "accent", true);
        return [
          el("div", {}, [
            el("div", { class: "mono", text: t.repo + " · " + t.id }),
            el("div", { class: "share-text", text: t.text })
          ]),
          copy,
          shared
        ];
      })));
    }
    var mt = missingTable(data.missing);
    if (mt) { box.appendChild(sectionTitle("확인하지 못한 레포")); box.appendChild(mt); }
  }


  // ---- 풀스택 신호 띠(가설 게이트) ----
  // 서버(GET /hypothesis-signal)가 센 숫자를 그대로 그린다. pct · n · m을 다시 계산하지 않고 목록도 자르지 않는다.
  // 응답 문자열은 textContent로만 넣는다(el()). 읽기 전용: 폼 · 버튼(펼침 토글 제외) · 쓰기 요청 없음.

  var hypState = { data: null, okAt: null, error: false, loaded: false, open: false, cardsFailed: false };
  var HYP_AREAS = [["FE", "FE"], ["BE", "BE"], ["infra", "infra"], ["domain", "도메인"]];
  var HYP_REASON = {
    "설정 없음": ["neutral", "원장 경로 설정 없음 · 설정의 hypothesis_ledger에 경로를 넣으세요 · 값을 못 냄"],
    "파일 없음": ["neutral", "원장 파일 없음 · 설정의 경로를 확인하세요 · 값을 못 냄"],
    "형식 확인 필요": ["attention", "원장 형식 확인 필요 · 읽을 수 없는 파일입니다 · 값을 못 냄"]
  };

  function hypReasonRow(tone, text) {
    return el("div", { class: "hyp-reason" + (tone === "neutral" ? "" : " " + tone) }, [
      el("span", { class: "dot", "aria-hidden": "true" }),
      el("span", { text: text })
    ]);
  }

  function hhmm(d) {
    function two(n) { return (n < 10 ? "0" : "") + n; }
    return two(d.getHours()) + ":" + two(d.getMinutes());
  }

  // 값 자리 글자: 로딩 = …, 못 읽음 · 값 없음 = —
  function hypStat(label, ratio, mode) {
    var kids = [el("span", { class: "hs-label", text: label })];
    if (mode === "loading") {
      kids.push(el("span", { class: "hs-value", text: "…" }));
    } else if (mode === "dash" || !ratio || ratio.pct === null || ratio.pct === undefined) {
      kids.push(el("span", { class: "hs-value", text: "—" }));
      if (mode === "empty") kids.push(el("span", { class: "hs-sub", text: "기록 없음" }));
    } else {
      kids.push(el("span", { class: "hs-value", text: ratio.pct + "%" }));
      kids.push(el("span", { class: "hs-sub", text: "(" + ratio.n + "/" + ratio.m + ")" }));
    }
    return el("div", { class: "hyp-stat" }, kids);
  }

  function hypNumStat(label, value, mode, badge) {
    var kids = [el("span", { class: "hs-label", text: label })];
    kids.push(el("span", { class: "hs-value", text: mode === "loading" ? "…" : (mode === "dash" ? "—" : String(value)) }));
    if (badge) {
      kids.push(el("span", { class: "hs-badge" }, [
        el("span", { class: "dot", "aria-hidden": "true" }),
        el("span", { text: "가설 재요구 중" })
      ]));
    }
    return el("div", { class: "hyp-stat" }, kids);
  }

  function hypCard(name, a, mode) {
    var val = function (v) { return mode === "loading" ? "…" : (mode === "dash" ? "—" : String(v)); };
    var bar = el("div", { class: "hyp-bar", "aria-hidden": "true" });
    if (mode === "ok" || mode === "empty") {
      [["right", a.right], ["partial", a.partial], ["wrong", a.wrong], ["pending", a.pending]].forEach(function (seg) {
        if (seg[1] > 0) {
          var d = el("div", { class: "seg-" + seg[0] });
          d.style.flex = String(seg[1]);
          bar.appendChild(d);
        }
      });
    }
    function lg(cls, label, v) {
      return el("span", {}, [
        el("span", { class: "lg " + cls, "aria-hidden": "true" }),
        document.createTextNode(label + " "),
        el("b", { text: val(v) })
      ]);
    }
    var anr = a.acc_no_reason || {};
    var anrText = mode === "ok" || mode === "empty" ? anr.n + "/" + anr.m : val("");
    var count = el("span", { class: "hc-count" }, [document.createTextNode("입력 "), el("b", { text: val(a.count) })]);
    return el("div", { class: "hyp-card" }, [
      el("div", { class: "hc-head" }, [el("span", { class: "hc-name", text: name }), count]),
      bar,
      el("div", { class: "hyp-legend" }, [
        lg("right", "맞음", a.right), lg("partial", "부분", a.partial),
        lg("wrong", "틀림", a.wrong), lg("pending", "판정 전", a.pending)
      ]),
      el("div", { class: "hc-noreason" }, [document.createTextNode("이유 없는 수락 "), el("b", { text: anrText })])
    ]);
  }

  function renderHypBand(band) {
    var focusToggle = document.activeElement && document.activeElement.id === "hyp-broken-toggle";
    clear(band);
    var d = hypState.data;
    var mode;
    if (d && d.missing) mode = "dash";
    else if (d) mode = d.empty ? "empty" : "ok";
    else mode = hypState.error ? "dash" : "loading";

    if (hypState.error) {
      var tail = d && hypState.okAt ? hhmm(hypState.okAt) + " 기준 값을 보여 줍니다 · " : "";
      band.appendChild(hypReasonRow("danger", "신호를 불러오지 못함 · " + tail + "15초 뒤 다시 시도합니다"));
    }
    if (d && d.missing) {
      var r = HYP_REASON[d.missing] || ["attention", "원장 " + String(d.missing) + " · 값을 못 냄"];
      band.appendChild(hypReasonRow(r[0], r[1]));
    }
    var vals = mode === "ok" || mode === "empty" ? d : {};
    var areas = vals.areas || {};
    band.appendChild(el("div", { class: "hyp-summary" }, [
      el("span", { class: "hyp-scope", text: "전체" }),
      hypStat("가설 먼저", vals.hyp_first, mode),
      el("span", { class: "hyp-sep", "aria-hidden": "true" }),
      hypStat("이유 없는 수락", vals.acc_no_reason, mode),
      el("span", { class: "hyp-sep", "aria-hidden": "true" }),
      hypNumStat("연속", vals.streak, mode, mode !== "loading" && !!vals.reasked),
      el("span", { class: "hyp-sep", "aria-hidden": "true" }),
      hypNumStat("건너뜀", vals.skipped, mode),
      el("span", { class: "hyp-ref", text: "참고값: 모델이 선언한 값" })
    ]));
    band.appendChild(el("div", { class: "hyp-cards" }, HYP_AREAS.map(function (pair) {
      return hypCard(pair[1], areas[pair[0]] || {}, mode);
    })));

    if (mode === "ok" || mode === "empty") {
      var broken = Array.isArray(d.broken) ? d.broken : [];
      var noIdent = d.no_ident || 0;
      var parts = [];
      if (broken.length > 0) parts.push("깨진 줄 " + broken.length + " (숫자가 낮을 수 있음)");
      if (noIdent > 0) parts.push("식별 없는 줄 " + noIdent + " (연속에서 제외)");
      if (parts.length > 0) {
        var noteText = parts.join(" · ");
        if (broken.length > 0) {
          var btn = el("button", {
            class: "inline-note attention hyp-toggle", type: "button", id: "hyp-broken-toggle",
            "aria-expanded": hypState.open ? "true" : "false"
          }, [
            el("span", { class: "dot", "aria-hidden": "true" }),
            el("span", { text: noteText })
          ]);
          btn.addEventListener("click", function () {
            hypState.open = !hypState.open;
            renderHypBand(band);
          });
          band.appendChild(btn);
          if (hypState.open) {
            band.appendChild(el("div", { class: "hyp-broken-list" }, broken.map(function (b) {
              var t = "줄 " + b.line + " · " + b.reason;
              if (b.fix !== undefined && b.fix !== null) t += " · 수정 후보: " + String(b.fix);
              return el("div", { text: t });
            })));
          }
        } else {
          band.appendChild(inlineNote(noteText, "attention"));
        }
      }
    }
    if (focusToggle) {
      var again = document.getElementById("hyp-broken-toggle");
      if (again) again.focus();
    }
  }

  function hypBandNode() { return document.getElementById("hyp-band"); }

  // 카드 요청과 독립으로 부른다. 실패해도 카드 화면은 건드리지 않는다.
  function fetchHypothesis() {
    function showable() { return activeTab === "comp" && activeSub === "fullstack"; }
    // 레포 칩 값이 있으면 그 레포 줄만으로 서버가 다시 계산한다(숫자는 화면에서 다시 계산하지 않는다).
    var repo = extraRepo.fullstack;
    fetch(repo === null ? "/hypothesis-signal" : "/hypothesis-signal?repo=" + encodeURIComponent(repo))
      .then(function (res) {
        if (!res.ok) throw new Error("hypothesis-signal " + res.status);
        return res.json();
      })
      .then(function (data) {
        // 응답이 늦게 와도 지금 고른 레포 것만 반영한다.
        if (extraRepo.fullstack !== repo) return;
        hypState.data = data;
        hypState.okAt = new Date();
        hypState.error = false;
        hypState.loaded = true;
        afterHypUpdate(showable());
      })
      .catch(function () {
        hypState.error = true;
        hypState.loaded = true;
        afterHypUpdate(showable());
      });
  }

  // 칩 선택지: 카드 레포 목록 ∪ 신호 응답의 repos(중복 없이). 카드가 0건이어도 repos가 있으면 보인다.
  var fsChipCtx = null; // { cards: [...], rerender: fn }
  function fillFsChipSlot(slot) {
    while (slot.firstChild) slot.removeChild(slot.firstChild);
    if (!fsChipCtx) return;
    var sigRepos = hypState.data && Array.isArray(hypState.data.repos) ? hypState.data.repos : [];
    var repos = uniq(fsChipCtx.cards.map(function (c) { return c.repo; }).concat(sigRepos));
    if (repos.length > 0) slot.appendChild(repoFilterChip("fullstack", repos, fsChipCtx.rerender));
  }

  function afterHypUpdate(visible) {
    if (!visible) return;
    var chipSlot = document.getElementById("fs-chip-slot");
    if (chipSlot) fillFsChipSlot(chipSlot);
    var band = hypBandNode();
    if (band) { renderHypBand(band); return; }
    // 카드 요청이 실패해 풀스택 화면이 아직 없으면 띠만이라도 그린다(독립 처리).
    if (hypState.cardsFailed) {
      var box = screenBox("comp-content", COMP_HEAD.fullstack[0], COMP_HEAD.fullstack[1], null);
      band = el("div", { class: "hyp-band", id: "hyp-band" });
      box.appendChild(band);
      renderHypBand(band);
    }
  }

  function renderFullstack(box, data, rerender) {
    var groups = data.groups || {};
    var missing = data.missing || [];
    var allCards = [];
    Object.keys(groups).forEach(function (a) { allCards = allCards.concat(groups[a] || []); });
    fsChipCtx = { cards: allCards, rerender: rerender };
    var chipSlot = el("div", { id: "fs-chip-slot" });
    box.appendChild(chipSlot);
    fillFsChipSlot(chipSlot);
    var hypBand = el("div", { class: "hyp-band", id: "hyp-band" });
    box.appendChild(hypBand);
    renderHypBand(hypBand);
    Object.keys(groups).forEach(function (area) {
      box.appendChild(sectionTitle(AREA_LABEL[area] || area));
      var cards = (groups[area] || []).filter(function (c) {
        return extraRepo.fullstack === null || c.repo === extraRepo.fullstack;
      });
      if (cards.length === 0) {
        box.appendChild(inlineNote("카드 없음", "neutral"));
        return;
      }
      box.appendChild(dataTable([
        { name: "카드", width: "minmax(0, 1fr)" },
        { name: "레포 · 위치", width: "220px" },
        { name: "상태", width: "150px" }
      ], cards.map(function (c) {
        var kids = [el("div", { text: c.title })];
        if (c.summary) kids.push(el("div", { class: "muted", text: c.summary }));
        return [
          el("div", {}, kids),
          el("span", { class: "mono", text: [c.repo, c.where].filter(Boolean).join(" · ") }),
          c.status ? statusDotLabel(c.status) : ""
        ];
      })));
    });
    var mt = missingTable(missing);
    if (mt) { box.appendChild(sectionTitle("확인하지 못한 레포")); box.appendChild(mt); }
  }

  function renderComp(sub, data) {
    lastExtra.comp = { sub: sub, data: data };
    var head = COMP_HEAD[sub] || COMP_HEAD.fullstack;
    var box = screenBox("comp-content", head[0], head[1], data.config);
    var rerender = function () {
      renderComp(sub, data);
      if (sub === "fullstack") fetchHypothesis(); // 칩이 바뀌면 신호도 다시 요청한다
    };
    if (sub === "workflow") renderWorkflow(box, data, rerender);
    else if (sub === "proactive") renderProactive(box, data);
    else renderFullstack(box, data, rerender);
  }

  function renderWeekly(data) {
    var box = screenBox("weekly-content", "주간 롤업", "지난 7일 합계와 레포별 진행을 본다.", data.config);
    var w = data.week || {};
    // 지난주 값을 주지 않으므로 증감은 없다 — kpiTile이 자리째 숨긴다
    box.appendChild(el("div", { class: "kpi-row" }, [
      kpiTile("세션", w.sessions),
      kpiTile("프로젝트", w.projects),
      kpiTile("커밋", w.commits),
      kpiTile("학습카드", w.cards),
      kpiTile("막힌 것", w.stuck)
    ]));
    box.appendChild(el("p", { class: "muted-line", text: "기록 있는 날 " + w.present + "/" + w.days }));
    if ((w.missing || []).length > 0) {
      box.appendChild(inlineNote("기록 없음: " + w.missing.join(", "), "attention"));
    }
    var repos = w.repos || [];
    box.appendChild(sectionTitle("레포별"));
    if (repos.length === 0) {
      box.appendChild(emptyStateCard("레포별 진행 없음", "커밋이 쌓이면 이 자리에 나타난다."));
      return;
    }
    box.appendChild(dataTable([
      { name: "레포", width: "180px" },
      { name: "커밋", width: "80px" },
      { name: "내용", width: "minmax(0, 1fr)" }
    ], repos.map(function (r) {
      return [
        el("span", { class: "mono", text: r.name }),
        String(r.commits),
        el("div", {}, (r.progress || []).map(function (p) { return el("div", { text: p }); }))
      ];
    })));
  }

  // 채점 도구가 주는 색 이름 → 의미색(DESIGN.md §2). 모르는 값은 neutral.
  var GRADE_TONE = { green: "success", amber: "attention", red: "danger" };

  function gradeBadge(grade, colorName) {
    var tone = GRADE_TONE[String(colorName || "").toLowerCase()] || "neutral";
    return el("span", { class: "grade-badge " + tone }, [
      el("span", { class: "dot", "aria-hidden": "true" }),
      el("span", { text: String(grade) })
    ]);
  }

  function renderHealth(data) {
    var box = screenBox("health-content", "레포 건강도", "레포별 AI 준비도 점수와 채점 경과일을 본다.", data.config);
    var rows = data.repos || [];
    if (rows.length === 0) {
      box.appendChild(emptyStateCard("등록된 레포 없음", "레포를 설정 파일에 등록하면 점수가 나타난다."));
      return;
    }
    var scored = rows.filter(function (r) { return !r.missing; });
    var missing = rows.filter(function (r) { return r.missing; }).map(function (r) {
      return { repo: r.repo, what: "", missing: r.missing };
    });
    if (scored.length > 0) {
      box.appendChild(dataTable([
        { name: "레포", width: "minmax(0, 1fr)" },
        { name: "점수", width: "80px" },
        { name: "등급", width: "170px" },
        { name: "채점", width: "170px" }
      ], scored.map(function (r) {
        return [
          el("span", { class: "mono", text: r.repo }),
          el("span", { class: "score", text: String(r.total) }),
          gradeBadge(r.grade, r.color || r.grade_color),
          el("span", { class: "muted", text: r.age_days + "일 전 채점 (" + r.scored_on + ")" })
        ];
      })));
    }
    var mt = missingTable(missing);
    if (mt) { box.appendChild(sectionTitle("채점하지 못한 레포")); box.appendChild(mt); }
  }

  // ---- 회고 화면 ----
  // 서버가 준 input("choice" | "long" | "line")만 보고 그린다. 종류 이름으로 분기하지 않는다.
  // 서버가 준 문자열은 전부 textContent로만 넣는다.

  var ROUTINE_STATE_LABEL = {
    unanswered: ["미답", "attention"],
    answered: ["답함", "success"],
    skipped: ["건너뜀", "neutral"]
  };
  var routineDrafts = {};

  function routineDraft(it) {
    if (!routineDrafts[it.id]) {
      routineDrafts[it.id] = {
        choice: it.input === "choice" && it.value ? it.value : null,
        value: it.value || "",
        note: it.note || "",
        saving: false,
        error: ""
      };
    }
    return routineDrafts[it.id];
  }

  function saveRoutine(it, draft, errorEl, syncActions) {
    var value = it.input === "choice" ? draft.choice : String(draft.value || "").trim();
    function fail(msg) {
      draft.saving = false;
      draft.error = msg;
      errorEl.textContent = msg;
      errorEl.hidden = false;
      syncActions();
    }
    if (!value) {
      fail(it.input === "choice" ? "선택지를 골라야 한다." : "답을 입력해야 한다.");
      return;
    }
    var body = { id: it.id, value: value };
    var note = String(draft.note || "").trim();
    if (note) body.note = note;
    draft.saving = true;
    draft.error = "";
    errorEl.hidden = true;
    syncActions();
    fetch("/routine/answer", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Desk-Token": DESK_TOKEN },
      body: JSON.stringify(body)
    })
      .then(function (res) {
        if (res.status === 200) {
          delete routineDrafts[it.id];
          fetchRoutine(false);
          return;
        }
        if (res.status === 403) {
          draft.saving = false;
          syncActions();
          showBanner("토큰이 맞지 않습니다 — 서버가 다시 떠서 토큰이 바뀌었을 수 있습니다. 새로고침 해주세요.", 0);
          return;
        }
        if (res.status === 404) { fail("저장하지 못했다: 질문함에서 이 문항을 찾지 못했다. 입력한 내용은 그대로 두었다."); return; }
        return res.json().then(function (data) {
          var msg = (data && data.violations && data.violations.join(", ")) || (data && data.error) || "저장하지 못했다";
          fail("저장하지 못했다: " + msg + ". 입력한 내용은 그대로 두었다.");
        }, function () { fail("저장하지 못했다. 입력한 내용은 그대로 두었다."); });
      })
      .catch(function () {
        fail("저장하지 못했다: 서버에 연결되지 않았다. 입력한 내용은 그대로 두었다.");
      });
  }

  function buildRoutineCard(it) {
    var draft = routineDraft(it);
    var st = ROUTINE_STATE_LABEL[it.state] || ROUTINE_STATE_LABEL.unanswered;
    var kids = [
      el("div", { class: "dc-head" }, [
        el("div", {}, [
          el("div", { class: "dc-title", text: it.text || "" }),
          el("div", { class: "dc-meta", text: [it.kind, it.date].filter(Boolean).join(" · ") })
        ]),
        statusDotLabel(st[0], st[1])
      ])
    ];
    var errorEl = el("p", { class: "dc-error", role: "alert" });
    errorEl.hidden = !draft.error;
    errorEl.textContent = draft.error;
    var saveBtn = button(it.state === "answered" ? "고쳐서 저장" : "저장", null, "accent", true);

    function syncActions() {
      saveBtn.disabled = draft.saving;
      if (draft.saving) saveBtn.textContent = "저장 중…";
      else saveBtn.textContent = it.state === "answered" ? "고쳐서 저장" : "저장";
    }

    var noteInput = null;
    if (it.input === "choice") {
      var opts = (it.options || []).map(function (o) {
        var b = el("button", { class: "dc-opt", type: "button", role: "radio" }, [
          el("span", { class: "dc-radio", "aria-hidden": "true" }),
          el("span", { text: o.label || o.key || "" })
        ]);
        return { key: o.key, btn: b };
      });
      var syncOpts = function () {
        opts.forEach(function (o) {
          var on = draft.choice === o.key;
          o.btn.classList.toggle("picked", on);
          o.btn.setAttribute("aria-checked", on ? "true" : "false");
        });
      };
      opts.forEach(function (o) {
        o.btn.addEventListener("click", function () {
          if (draft.saving) return;
          draft.choice = o.key;
          syncOpts();
        });
      });
      syncOpts();
      kids.push(el("div", { class: "dc-options", role: "radiogroup", "aria-label": "선택지" }, opts.map(function (o) { return o.btn; })));
      noteInput = el("input", { type: "text", placeholder: "이유(선택)", "aria-label": "이유" });
      noteInput.value = draft.note;
      noteInput.addEventListener("input", function () { draft.note = noteInput.value; });
      kids.push(el("div", { class: "dc-note-row" }, [noteInput]));
    } else if (it.input === "long") {
      var ta = el("textarea", { placeholder: "여러 줄로 쓴다", "aria-label": "답" });
      ta.value = draft.value;
      ta.addEventListener("input", function () { draft.value = ta.value; });
      kids.push(ta);
    } else {
      var line = el("input", { type: "text", placeholder: "한 줄로 쓴다", "aria-label": "답" });
      line.value = draft.value;
      line.addEventListener("input", function () { draft.value = line.value; });
      kids.push(el("div", { class: "dc-note-row" }, [line]));
    }

    kids.push(errorEl);
    saveBtn.addEventListener("click", function () {
      if (draft.saving) return;
      saveRoutine(it, draft, errorEl, syncActions);
    });
    syncActions();
    kids.push(el("div", { class: "dc-actions" }, [saveBtn]));
    return el("div", { class: "decision-card" }, kids);
  }

  function renderRoutine(data) {
    lastExtra.routine = data;
    var container = document.getElementById("routine-content");
    // 글을 쓰는 중이면 폴링이 입력칸을 지우지 않도록 다음 주기로 미룬다.
    var active = document.activeElement;
    if (active && container.contains(active) && (active.tagName === "TEXTAREA" || active.tagName === "INPUT")) return;

    var box = screenBox("routine-content", "회고", "오늘 문항에 답한다. 못 답한 날은 건너뜀으로 남고, 지금이라도 답할 수 있다.", data.config);
    var groups = data.groups || [];
    var past = data.past || [];
    var missing = data.missing || [];

    missing.forEach(function (m) {
      box.appendChild(emptyStateCard(String(m.what || "확인 필요") + ": " + String(m.reason || "확인 필요"), "설정과 파일을 확인하면 이 자리에 문항이 나타난다."));
    });
    if (data.broken > 0) {
      box.appendChild(inlineNote("깨진 줄 " + data.broken + "개 건너뜀", "attention"));
    }
    if (groups.length === 0 && missing.length === 0) {
      box.appendChild(emptyStateCard("오늘 문항 없음", "새 문항이 올라오면 이 자리에 나타난다."));
    }
    groups.forEach(function (g) {
      box.appendChild(sectionTitle(String(g.kind || "")));
      var grid = el("div", { class: "card-grid" });
      (g.items || []).forEach(function (it) { grid.appendChild(buildRoutineCard(it)); });
      box.appendChild(grid);
    });
    if (past.length > 0) {
      box.appendChild(sectionTitle("지난 건너뜀"));
      var pgrid = el("div", { class: "card-grid" });
      past.forEach(function (it) { pgrid.appendChild(buildRoutineCard(it)); });
      box.appendChild(pgrid);
    }
  }

  // withRollover: 탭이 선택될 때만 true. rollover(POST)가 끝난 뒤 GET을 부른다(실패해도 GET은 부른다).
  function fetchRoutine(withRollover) {
    function get() {
      fetch("/routine")
        .then(function (res) {
          if (!res.ok) throw new Error("routine " + res.status);
          return res.json();
        })
        .then(function (data) {
          if (activeTab !== "routine") return;
          renderRoutine(data);
        })
        .catch(function () {
          // 다음 polling에서 다시 시도한다 — 화면을 지우지 않는다.
        });
    }
    if (!withRollover) { get(); return; }
    fetch("/routine/rollover", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Desk-Token": DESK_TOKEN },
      body: "{}"
    }).then(get, get);
  }

  function fetchExtra(tab) {
    var url;
    var render;
    if (tab === "review") { url = "/review"; render = renderReview; }
    else if (tab === "weekly") { url = "/weekly"; render = renderWeekly; }
    else if (tab === "health") { url = "/repo-health"; render = renderHealth; }
    else if (tab === "comp") {
      var sub = activeSub;
      url = "/competency/" + sub;
      render = function (d) { hypState.cardsFailed = false; renderComp(sub, d); };
      if (sub === "fullstack") fetchHypothesis();
    } else return;
    fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error(url + " " + res.status);
        return res.json();
      })
      .then(function (data) {
        // 응답이 늦게 와도 지금 보는 탭 · 서브 탭 것만 그린다.
        if (activeTab !== tab) return;
        if (tab === "comp" && url !== "/competency/" + activeSub) return;
        render(data);
      })
      .catch(function () {
        // 다음 polling에서 다시 시도한다 — 화면을 지우지 않는다.
        if (tab === "comp" && activeTab === "comp" && url === "/competency/" + activeSub && activeSub === "fullstack") {
          hypState.cardsFailed = true;
          if (hypState.loaded) afterHypUpdate(true);
        }
      });
  }

  // 보이는 확장 탭 하나만 부른다(ADR-010). 트랙 · 판정은 아래 기존 polling이 맡는다.
  function loadVisibleExtra() {
    if (activeTab === "track" || activeTab === "judge") return;
    if (activeTab === "routine") { fetchRoutine(false); return; }
    if (activeTab === "trends") { fetchTrends(); return; }
    fetchExtra(activeTab);
  }

  // ---- 기술 동향 ----
  // 서버(GET /trends)가 건수 · 단계 · 읽음 여부를 다 계산해 준다. 화면은 받은 대로 그린다.
  // 응답 문자열은 textContent로만 넣는다(el()). 링크는 http · https만 <a>로 만든다.

  var trendsUi = {
    readErr: {},   // id → 읽음 기록 실패 한 줄
    markErr: {},   // id → 북마크 실패 한 줄(읽음 에러와 따로)
    bmFilter: "all" // 북마크 필터 칩(메모리만) all | unread | read
  };
  var BOOKMARK_PATH = "m19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z";

  function safeHref(url) {
    if (typeof url !== "string") return null;
    try {
      var u = new URL(url);
      return u.protocol === "http:" || u.protocol === "https:" ? { href: u.href, host: u.host } : null;
    } catch (e) {
      return null;
    }
  }

  function bookmarkIcon() {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("width", "14");
    svg.setAttribute("height", "14");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("stroke-width", "2");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", BOOKMARK_PATH);
    svg.appendChild(path);
    return svg;
  }

  function trendsRerender() {
    if (lastExtra.trends) renderTrends(lastExtra.trends);
  }

  // 다시 그리면 노드가 바뀌어 포커스가 사라진다. 그리기 전 포커스를 기억했다가 같은 글 · 같은 종류에 돌려준다.
  function trendsFocusNow() {
    var a = document.activeElement;
    var box = document.getElementById("trends-content");
    if (!a || !box || !box.contains(a) || !a.getAttribute("data-trend-kind")) return null;
    return { id: a.getAttribute("data-trend-id"), kind: a.getAttribute("data-trend-kind") };
  }

  function restoreTrendsFocus(f) {
    if (!f) return;
    var nodes = document.querySelectorAll("#trends-content [data-trend-kind]");
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].getAttribute("data-trend-id") === f.id && nodes[i].getAttribute("data-trend-kind") === f.kind) {
        nodes[i].focus();
        return;
      }
    }
  }

  // 응답에서 같은 글을 찾아 값을 바꾼다(성공 직후 바로 보이게. 곧 이어 서버 값으로 다시 받는다).
  function patchTrendsItem(id, field, value) {
    var d = lastExtra.trends;
    if (!d) return;
    ["today", "past_unread", "bookmarks"].forEach(function (k) {
      (d[k] || []).forEach(function (it) {
        if (it && it.id === id) it[field] = value;
      });
    });
  }

  function onTrendRead(it, data) {
    if (it.read || !data.can_record_read) return; // 이미 읽음 · 기록 불가: 링크만 열린다
    postMark("/trends/read", { id: it.id }, function () {
      delete trendsUi.readErr[it.id];
      patchTrendsItem(it.id, "read", true);
      trendsRerender();
      fetchTrends();
      fetchNavCounts(); // 안 읽은 글 배지도 바로 맞춘다
    }, function (msg) {
      trendsUi.readErr[it.id] = "읽음 기록 실패: " + msg + ". 안 읽음으로 남는다";
      trendsRerender();
    });
  }

  function onTrendMark(it) {
    var next = !it.bookmarked;
    postMark("/trends/mark", { id: it.id, on: next }, function () {
      delete trendsUi.markErr[it.id];
      patchTrendsItem(it.id, "bookmarked", next);
      trendsRerender();
      fetchTrends();
    }, function (msg) {
      trendsUi.markErr[it.id] = "북마크 실패: " + msg;
      trendsRerender();
    });
  }

  function buildTrendCard(it, data) {
    var read = it.read === true;
    var left = [];
    var linkInfo = safeHref(it.url);
    if (linkInfo) {
      var a = el("a", { class: "tc-link", href: linkInfo.href, target: "_blank", rel: "noopener noreferrer", "data-trend-id": String(it.id), "data-trend-kind": "link" });
      a.appendChild(document.createTextNode("원문 열기 · "));
      a.appendChild(el("span", { class: "host", text: linkInfo.host }));
      a.appendChild(document.createTextNode(" ↗"));
      // 링크는 항상 열린다(preventDefault 없음). 읽음 기록은 따로 보낸다.
      a.addEventListener("click", function () { onTrendRead(it, data); });
      left.push(a);
    } else {
      left.push(el("span", { class: "tc-plain", text: "열 수 없는 링크(http · https 아님): " + String(it.url || "") }));
    }
    if (!read) {
      if (!data.can_record_read) left.push(el("span", { class: "tc-hint", text: "읽음 기록 불가: 읽음 파일 설정(trends_reads)이 없다" }));
    }

    var on = it.bookmarked === true;
    var bm = el("button", { class: "bm-btn", type: "button", "aria-pressed": on ? "true" : "false", "data-trend-id": String(it.id), "data-trend-kind": "mark" });
    bm.appendChild(bookmarkIcon());
    bm.appendChild(document.createTextNode("북마크"));
    if (!data.can_bookmark) bm.disabled = true;
    else bm.addEventListener("click", function () { onTrendMark(it); });
    var right = [bm];
    if (!data.can_bookmark) right.unshift(el("span", { class: "tc-hint", text: "북마크 불가: 북마크 파일 설정(trends_marks)이 없다" }));

    var kids = [
      el("div", { class: "tc-head" }, [
        el("span", { class: "tc-title", text: String(it.title || "") }),
        el("span", { class: "tc-state " + (read ? "read" : "unread") }, [
          el("span", { class: "dot", "aria-hidden": "true" }),
          el("span", { text: read ? "읽음" : "안 읽음" })
        ])
      ]),
      el("p", { class: "tc-summary", text: String(it.summary || "") }),
      el("div", { class: "tc-foot" }, [
        el("div", { class: "tc-left" }, left),
        el("div", { class: "tc-right" }, right)
      ])
    ];
    if (trendsUi.readErr[it.id]) kids.push(el("p", { class: "tc-error", role: "alert", text: trendsUi.readErr[it.id] }));
    if (trendsUi.markErr[it.id]) kids.push(el("p", { class: "tc-error", role: "alert", text: trendsUi.markErr[it.id] }));
    return el("div", { class: "trend-card" + (read ? " is-read" : "") }, kids);
  }

  function heatLevel(n) {
    n = typeof n === "number" && isFinite(n) ? Math.floor(n) : 0;
    return n < 0 ? 0 : n > 3 ? 3 : n;
  }

  function buildHeatmap(cells) {
    var MONTHS = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"];
    var grid = el("div", { class: "hm-grid" });
    var months = el("div", { class: "hm-months" });
    var firstDow = 0;
    var lastMonthCol = -10;
    cells.forEach(function (c, i) {
      var parts = String(c.date || "").split("-");
      var y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
      var dow = new Date(y, m - 1, d).getDay(); // 배치용 요일(0=일)
      if (i === 0) firstDow = dow;
      var col = Math.floor((i + firstDow) / 7);
      var row = (i + firstDow) % 7;
      var total = typeof c.total === "number" ? c.total : 0;
      var read = typeof c.read === "number" ? c.read : 0;
      var tip = String(c.date) + " · " + (total > 0 ? "글 " + total + "건 중 " + read + "건 읽음" : "글 없음");
      var cell = el("span", { class: "hm-cell l" + heatLevel(read), title: tip, "aria-hidden": "true" });
      cell.style.gridColumn = String(col + 1);
      cell.style.gridRow = String(row + 1);
      grid.appendChild(cell);
      // 달 이름: 그 달 1일이 든 칸 열 위에(바로 앞 라벨과 겹치지 않게 3열 이상 띄운다)
      if (d === 1 && m >= 1 && m <= 12 && col - lastMonthCol >= 3) {
        var lab = el("span", { text: MONTHS[m - 1] });
        lab.style.gridColumn = String(col + 1);
        lab.style.gridRow = "1";
        months.appendChild(lab);
        lastMonthCol = col;
      }
    });
    var days = el("div", { class: "hm-days", "aria-hidden": "true" }, [
      el("span", { text: "" }), el("span", { text: "월" }), el("span", { text: "" }), el("span", { text: "수" }),
      el("span", { text: "" }), el("span", { text: "금" }), el("span", { text: "" })
    ]);
    var legend = el("div", { class: "hm-legend", "aria-hidden": "true" }, [
      el("span", { text: "읽은 건수 " }),
      el("span", { class: "hm-cell l0" }), el("span", { text: "0" }),
      el("span", { class: "hm-cell l1" }), el("span", { text: "1" }),
      el("span", { class: "hm-cell l2" }), el("span", { text: "2" }),
      el("span", { class: "hm-cell l3" }), el("span", { text: "3건" })
    ]);
    return el("div", { class: "hm-box" }, [
      el("div", { class: "hm-head" }, [
        el("span", { class: "t", text: "읽은 기록 · 최근 1년" }),
        el("span", { class: "d", text: "글이 나온 날 기준. 지난 글을 읽으면 그 글이 나온 날 칸이 진해진다" })
      ]),
      el("div", { class: "hm-wrap", role: "img", "aria-label": "최근 1년 읽은 기록. 칸마다 그날 글 몇 건 중 몇 건을 읽었는지 툴팁으로 본다" }, [
        days,
        el("div", { class: "hm-main" }, [months, grid])
      ]),
      legend
    ]);
  }

  function renderTrendsToday(data) {
    var box = screenBox("trends-content", "오늘의 기술 동향", "오늘 나온 글. 잔디는 그날 글을 몇 건 읽었는지 보여 준다.", null);
    var missing = data.missing || [];
    missing.forEach(function (m) {
      box.appendChild(emptyStateCard(String(m.what || "확인 필요") + ": " + String(m.reason || "확인 필요"), "설정과 파일을 확인하면 이 자리에 오늘 글이 나타난다."));
    });
    if (data.broken > 0) box.appendChild(inlineNote("깨진 줄 " + data.broken + "개 건너뜀", "attention"));
    if (missing.length > 0) return;
    var today = data.today || [];
    if (today.length === 0) {
      box.appendChild(emptyStateCard("오늘 동향 0건", "오늘 글이 올라오면 이 자리에 나타난다."));
    } else {
      var list = el("div", { class: "trend-list" });
      today.forEach(function (it) { list.appendChild(buildTrendCard(it, data)); });
      box.appendChild(list);
    }
    box.appendChild(buildHeatmap(data.heatmap || []));
  }

  // 줄 하나(안 읽은 글 · 북마크 공용). 읽음 · 북마크 핸들러는 카드와 같은 것을 쓴다.
  // withState: 읽음 여부 칸을 넣는다(북마크 목록). 북마크 버튼은 항상 맨 오른쪽 칸.
  function buildTrendRow(it, data, withState) {
    var read = it.read === true;
    var linkInfo = safeHref(it.url);
    var linkNode;
    if (linkInfo) {
      linkNode = el("a", { class: "tc-link", href: linkInfo.href, target: "_blank", rel: "noopener noreferrer", "data-trend-id": String(it.id), "data-trend-kind": "link" });
      linkNode.appendChild(document.createTextNode("원문 열기 · "));
      linkNode.appendChild(el("span", { class: "host", text: linkInfo.host }));
      linkNode.appendChild(document.createTextNode(" ↗"));
      linkNode.addEventListener("click", function () { onTrendRead(it, data); });
    } else {
      linkNode = el("span", { class: "tc-plain", text: "열 수 없는 링크" });
    }
    var on = it.bookmarked === true;
    var bm = el("button", { class: "bm-btn tr-bm", type: "button", "aria-pressed": on ? "true" : "false", "data-trend-id": String(it.id), "data-trend-kind": "mark" });
    bm.appendChild(bookmarkIcon());
    bm.appendChild(document.createTextNode("북마크"));
    if (!data.can_bookmark) bm.disabled = true;
    else bm.addEventListener("click", function () { onTrendMark(it); });

    var main = el("div", { class: "tr-main" }, [
      el("span", { class: "tr-title", text: String(it.title || ""), title: String(it.title || "") })
    ]);
    if (!withState) main.appendChild(el("span", { class: "tr-sum", text: String(it.summary || "") }));
    var kids = [el("span", { class: "tr-date", text: String(it.date || "") }), main];
    if (withState) {
      kids.push(el("span", { class: "tr-state " + (read ? "read" : "unread") }, [
        el("span", { class: "dot", "aria-hidden": "true" }),
        el("span", { text: read ? "읽음" : "안 읽음" })
      ]));
    }
    kids.push(linkNode);
    kids.push(bm);
    if (trendsUi.readErr[it.id]) kids.push(el("p", { class: "tc-error", role: "alert", text: trendsUi.readErr[it.id] }));
    if (trendsUi.markErr[it.id]) kids.push(el("p", { class: "tc-error", role: "alert", text: trendsUi.markErr[it.id] }));
    return el("li", { class: "tr-row" }, kids);
  }

  // 이유 행 · 깨진 줄 · 설정 안내를 공통으로 그린다. 이유 행이 있으면 true(목록은 안 그린다).
  function trendsListPrelude(box, data) {
    var missing = data.missing || [];
    missing.forEach(function (m) {
      box.appendChild(emptyStateCard(String(m.what || "확인 필요") + ": " + String(m.reason || "확인 필요"), "설정과 파일을 확인하면 이 자리에 글이 나타난다."));
    });
    if (data.broken > 0) box.appendChild(inlineNote("깨진 줄 " + data.broken + "개 건너뜀", "attention"));
    return missing.length > 0;
  }

  function renderTrendsUnread(data) {
    var box = screenBox("trends-content", "안 읽은 글", "오늘 이전에 나온 글 중 아직 읽지 않은 글을 모두 보여 준다.", null);
    if (trendsListPrelude(box, data)) return;
    var rows = (data.past_unread || []).filter(function (it) { return it && it.read !== true; });
    rows.sort(function (a, b) { return String(b.date || "") < String(a.date || "") ? -1 : String(b.date || "") > String(a.date || "") ? 1 : 0; });
    if (!data.can_record_read) box.appendChild(el("p", { class: "tr-note", text: "읽음 기록 불가: 읽음 파일 설정(trends_reads)이 없다. 링크는 열리지만 이 목록에서 빠지지 않는다" }));
    if (!data.can_bookmark) box.appendChild(el("p", { class: "tr-note", text: "북마크 불가: 북마크 파일 설정(trends_marks)이 없다" }));
    if (rows.length === 0) {
      box.appendChild(emptyStateCard("안 읽은 글 없음", "지난 날 글을 모두 읽었다."));
      return;
    }
    var list = el("ul", { class: "tr-list unread", "aria-label": "안 읽은 글 " + rows.length + "건" });
    list.appendChild(el("li", { class: "tr-head", "aria-hidden": "true" }, [
      el("span", { text: "나온 날" }), el("span", { text: "글" }), el("span", { text: "" }), el("span", { class: "tr-bm", text: "북마크" })
    ]));
    rows.forEach(function (it) { list.appendChild(buildTrendRow(it, data, false)); });
    box.appendChild(list);
    box.appendChild(el("p", { class: "tr-note", text: "전체 " + rows.length + "건" }));
  }

  var TRENDS_FILTERS = [["all", "전체"], ["unread", "안 읽음"], ["read", "읽음"]];

  function renderTrendsBookmarks(data) {
    var box = screenBox("trends-content", "북마크", "나중에 다시 보거나 두고두고 볼 글을 쌓아 둔다. 읽은 글도 안 읽은 글도 담긴다.", null);
    if (trendsListPrelude(box, data)) return;
    var all = (data.bookmarks || []).filter(function (it) { return it && it.bookmarked !== false; });
    all.sort(function (a, b) { return String(b.date || "") < String(a.date || "") ? -1 : String(b.date || "") > String(a.date || "") ? 1 : 0; });
    if (!data.can_bookmark) box.appendChild(el("p", { class: "tr-note", text: "북마크 불가: 북마크 파일 설정(trends_marks)이 없다. 버튼은 눌리지 않는다" }));
    if (!data.can_record_read) box.appendChild(el("p", { class: "tr-note", text: "읽음 기록 불가: 읽음 파일 설정(trends_reads)이 없다" }));
    if (all.length === 0) {
      box.appendChild(emptyStateCard("북마크한 글 없음", "글 카드나 목록의 북마크 버튼을 누르면 여기에 쌓인다. 읽은 글도 안 읽은 글도 담을 수 있다."));
      return;
    }
    var nUnread = all.filter(function (it) { return it.read !== true; }).length;
    var counts = { all: all.length, unread: nUnread, read: all.length - nUnread };
    var chips = el("div", { class: "tr-chips", role: "group", "aria-label": "읽음 여부 필터" });
    TRENDS_FILTERS.forEach(function (f) {
      var b = el("button", { class: "tr-chip", type: "button", "aria-pressed": trendsUi.bmFilter === f[0] ? "true" : "false", text: f[1] + " " + counts[f[0]] });
      b.addEventListener("click", function () { trendsUi.bmFilter = f[0]; trendsRerender(); });
      chips.appendChild(b);
    });
    box.appendChild(chips);
    var rows = all.filter(function (it) {
      return trendsUi.bmFilter === "all" || (trendsUi.bmFilter === "read") === (it.read === true);
    });
    if (rows.length === 0) {
      var label = trendsUi.bmFilter === "unread" ? "안 읽은 북마크 없음" : "읽은 북마크 없음";
      var hint = trendsUi.bmFilter === "unread" ? "북마크한 글을 모두 읽었다. 전체나 읽음으로 바꿔 본다." : "북마크한 글을 아직 읽지 않았다. 전체나 안 읽음으로 바꿔 본다.";
      box.appendChild(emptyStateCard(label, hint));
      return;
    }
    var list = el("ul", { class: "tr-list marks", "aria-label": "북마크 " + rows.length + "건" });
    list.appendChild(el("li", { class: "tr-head", "aria-hidden": "true" }, [
      el("span", { text: "나온 날" }), el("span", { text: "글" }), el("span", { text: "읽음 여부" }), el("span", { text: "" }), el("span", { class: "tr-bm", text: "북마크" })
    ]));
    rows.forEach(function (it) { list.appendChild(buildTrendRow(it, data, true)); });
    box.appendChild(list);
  }

  function renderTrends(data) {
    lastExtra.trends = data;
    var focus = trendsFocusNow();
    if (trendsSub === "unread") renderTrendsUnread(data);
    else if (trendsSub === "bookmarks") renderTrendsBookmarks(data);
    else renderTrendsToday(data);
    restoreTrendsFocus(focus);
  }

  function fetchTrends() {
    fetch("/trends")
      .then(function (res) {
        if (!res.ok) throw new Error("trends " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (activeTab !== "trends") return;
        renderTrends(data);
      })
      .catch(function () {
        // 다음 polling에서 다시 시도한다 — 화면을 지우지 않는다.
      });
  }

  // ---- 메뉴 배지 (ADR-014(임시)) — 메뉴는 항상 보이므로 탭 폴링과 별개로 부른다 ----

  var navCounts = { judge: 0, review: 0 };
  var routineBadge = { n: 0, reason: "" };
  var trendsBadge = null; // 숫자 | null(못 구함 → 이 배지만 숨김)

  function renderNavBadges() {
    ["judge", "review"].forEach(function (key) {
      var badge = document.querySelector('[data-badge="' + key + '"]');
      if (!badge) return;
      var n = navCounts[key];
      badge.textContent = n > 0 ? String(n) : "";
      var item = badge.closest(".menu-item");
      if (item) {
        if (n > 0) item.setAttribute("data-has-badge", "1");
        else item.removeAttribute("data-has-badge");
      }
    });
    // 회고: 숫자가 null이면 배지를 숨기고 항목 툴팁(title)에 이유를 준다.
    var rb = document.querySelector('[data-badge="routine"]');
    if (rb) {
      var rn = routineBadge.n;
      rb.textContent = typeof rn === "number" && rn > 0 ? String(rn) : "";
      var ritem = rb.closest(".menu-item");
      if (ritem) {
        if (typeof rn === "number" && rn > 0) ritem.setAttribute("data-has-badge", "1");
        else ritem.removeAttribute("data-has-badge");
        if (rn === null && routineBadge.reason) ritem.setAttribute("title", "미답 수를 세지 못했다: " + routineBadge.reason);
        else ritem.removeAttribute("title");
      }
    }
    // 기술 동향: 「안 읽은 글」 항목 배지. 0 · null이면 숨긴다. 접힌 메뉴는 하위 목록이 안 보여 부모에 점을 단다.
    var tb = document.querySelector('[data-badge="trends"]');
    if (tb) {
      var tn = trendsBadge;
      var tshow = typeof tn === "number" && tn > 0;
      tb.textContent = tshow ? String(tn) : "";
      if (tshow) tb.setAttribute("aria-label", "안 읽은 글 " + tn + "건");
      else tb.removeAttribute("aria-label");
      if (tshow) trendsParent.setAttribute("data-has-badge", "1");
      else trendsParent.removeAttribute("data-has-badge");
    }
  }

  function fetchNavCounts() {
    fetch("/nav-counts")
      .then(function (res) {
        if (res.status !== 200) throw new Error("nav-counts " + res.status);
        return res.json();
      })
      .then(function (data) {
        ["judge", "review"].forEach(function (key) {
          var v = data && data[key];
          if (typeof v === "number" && isFinite(v) && v >= 0 && Math.floor(v) === v) {
            navCounts[key] = v;
          }
        });
        var rv = data && data.routine;
        if (rv === null) {
          var why = data.errors && data.errors.routine;
          routineBadge = { n: null, reason: typeof why === "string" ? why : "" };
        } else if (typeof rv === "number" && isFinite(rv) && rv >= 0 && Math.floor(rv) === rv) {
          routineBadge = { n: rv, reason: "" };
        }
        var tv = data && data.trends;
        if (tv === null) trendsBadge = null;
        else if (typeof tv === "number" && isFinite(tv) && tv >= 0 && Math.floor(tv) === tv) trendsBadge = tv;
        renderNavBadges();
      })
      .catch(function () { /* 배지는 부가 정보 — 마지막 값 유지, 에러 줄 없음 */ });
  }

  // ---- 시작 ----

  renderTrack();
  renderJudge();
  fetchSessions();
  fetchJudgments();
  fetchNavCounts();
  setInterval(fetchSessions, POLL_MS);
  setInterval(fetchJudgments, POLL_MS);
  setInterval(loadVisibleExtra, POLL_MS);
  setInterval(fetchNavCounts, POLL_MS);
})();
</script>
</body>
</html>
